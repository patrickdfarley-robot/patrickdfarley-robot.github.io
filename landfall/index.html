    const p = groundPoint();
    if (p.y > H + 30 || p.y < hc(p.x)) continue;
    g.fillStyle = col(C.ground, rnd() < 0.5 ? 13 : -11, 0.14 + 0.12 * rnd());
    g.beginPath();
    g.ellipse(p.x, p.y, p.s * (6 + rnd() * 22), p.s * (1.2 + rnd() * 5), 0, 0, TAU);
    g.fill();
  }

  // 2 — wind streaks, all along one prevailing direction: what makes a plain
  // read as swept rather than painted.
  for (let i = 0; i < 90; i++) {
    const p = groundPoint();
    if (p.y > H + 30 || p.y < hc(p.x)) continue;
    const len = p.s * (18 + rnd() * 60);
    g.save();
    g.translate(p.x, p.y);
    g.rotate(0.06 + (rnd() - 0.5) * 0.08);
    g.fillStyle = col(C.ground, rnd() < 0.6 ? 19 : -14, 0.1 + 0.1 * rnd());
    g.beginPath();
    g.ellipse(0, 0, len, Math.max(0.7, p.s * (0.3 + rnd() * 0.9)), 0, 0, TAU);
    g.fill();
    g.restore();
  }

  // 3 — gravel: dense near the camera where the eye looks for texture,
  // thinning to nothing by the horizon.
  for (let i = 0; i < 700; i++) {
    const p = groundPoint();
    if (p.y > H + 10 || p.y < hc(p.x) + H * 0.02) continue;
    const r = Math.max(0.6, p.s * (0.16 + rnd() * 0.42));
    g.fillStyle = col(C.rock, rnd() < 0.4 ? 16 : -16, 0.3 + 0.3 * rnd());
    g.beginPath();
    g.ellipse(p.x, p.y, r * 1.6, r, 0, 0, TAU);
    g.fill();
  }

  // 4 — pale drift collecting in the middle distance, so the plain carries a
  // value gradient toward the horizon instead of one flat tone.
  for (let i = 0; i < 40; i++) {
    const z = 90 + rnd() * 500;
    const x = rnd() * W;
    const y0 = view.sy(z);
    const y = y0 + view.curveAt(x, y0);
    if (y < hc(x)) continue;
    const s = view.scaleAt(z);
    g.fillStyle = col(C.groundFar, 7, 0.07 + 0.05 * rnd());
    g.beginPath();
    g.ellipse(x, y, s * (30 + rnd() * 90), s * (3 + rnd() * 10), 0, 0, TAU);
    g.fill();
  }

  /* --------------------------------------------- static sprites, far to near
   * Terrain, roads, vegetation and ponds are all static for the week, so they
   * are baked in rather than re-instanced every frame. */
  const draw = (name, x, z, scale, alpha) => {
    const sp = atlas.sprites[name];
    if (!sp) return;
    const s = view.scaleAt(z);
    const w = sp.metres * scale * s;
    const h = w * sp.aspect;
    const px = view.sx(x, z);
    const py = view.sy(z) + view.curveAt(view.sx(x, z), view.sy(z));
    if (px + w < -40 || px - w > W + 40 || py < hy - 10 || py - h > H + 10) return;
    const haze = 1 - 0.66 * clamp((z - view.zBottom) / 260, 0, 1);
    g.globalAlpha = (alpha === undefined ? 1 : alpha) * haze;
    g.drawImage(atlas.canvas, sp.x, sp.y, sp.w, sp.h,
                px - w / 2, py - h * sp.anchorY, w, h);
    g.globalAlpha = 1;
  };

  const statics = [];
  for (const t of world.terrain) statics.push({ ...t, kindOrder: 0 });
  for (const r of world.routes) {
    // Lay a road as a run of overlapping tiles, so it follows perspective.
    const steps = 14;
    for (let i = 0; i <= steps; i++) {
      const f = i / steps;
      if (rnd() > world.paveFrac && f > 0.25) continue;
      statics.push({ sprite: 'road',
                     x: lerp(r.ax, r.bx, f), z: lerp(r.az, r.bz, f),
                     scale: 0.55 + 0.25 * (1 - f), alpha: 0.85, kindOrder: 1 });
    }
  }
  for (const p of world.ponds) statics.push({ ...p, kindOrder: 2 });
  for (const v of world.veg) statics.push({ ...v, kindOrder: 3 });
  statics.sort((a, b) => (b.z - a.z) || (a.kindOrder - b.kindOrder));
  for (const s of statics) draw(s.sprite, s.x, s.z, s.scale, s.alpha);

  /* A soft vignette, same cinematic trick as Fleet Action: pull the eye to the
   * middle of the settlement without ever going to dead black. */
  const vg = g.createRadialGradient(W * 0.5, hy + (H - hy) * 0.46, Math.min(W, H) * 0.24,
                                    W * 0.5, hy + (H - hy) * 0.46, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(6,10,18,0.42)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W, H);

  return cv;
}

/* ===========================================================================
 *  SCENE — the per-frame instance list. Both render paths consume this one
 *  list, so they cannot drift apart. No allocation happens in here: every
 *  entry comes from a preallocated pool, and every particle is a pure function
 *  of event-local time rather than a stateful system.
 * ======================================================================== */

function makeScene(d, world, atlas) {
  const view = world.view;
  const SP = atlas.sprites;
  const C = d.colony;
  const T = d.temper;

  /* --- pools ------------------------------------------------------------- */
  const base = [], add = [], dyn = [];
  for (let i = 0; i < CFG.maxInstances; i++) base.push({ s: null, x: 0, y: 0, w: 0, h: 0, a: 1 });
  for (let i = 0; i < CFG.maxFx * 4 + 400; i++) add.push({ s: null, x: 0, y: 0, w: 0, h: 0, a: 1 });
  for (let i = 0; i < 700; i++) dyn.push({ sprite: '', lit: '', x: 0, z: 0, scale: 1, a: 1, shadow: 0 });
  let nBase = 0, nAdd = 0, nDyn = 0;

  function emit(spriteName, px, py, wpx, alpha, anchorY, aspect, additive) {
    const arr = additive ? add : base;
    const n = additive ? nAdd : nBase;
    if (n >= arr.length) return;
    const it = arr[n];
    it.s = spriteName;
    it.w = wpx;
    it.h = wpx * aspect;
    it.x = px;
    it.y = py + view.curveAt(px, py) - it.h * anchorY + it.h * 0.5;
    it.a = alpha;
    if (additive) nAdd = n + 1; else nBase = n + 1;
  }
  /* How much of the air you are looking through. 1 at the camera, falling to
   * HAZE_FLOOR out at the horizon. */
  const HAZE_FLOOR = 0.34;
  function hazeAt(z) {
    return 1 - (1 - HAZE_FLOOR) * clamp((z - view.zBottom) / 260, 0, 1);
  }

  /* World-space emit: metres and depth in, pixels out. */
  function world2(spriteName, x, z, scale, alpha, additive) {
    const sp = SP[spriteName];
    if (!sp || z < 5) return;
    alpha *= hazeAt(z);
    const s = view.scaleAt(z);
    const wpx = sp.metres * scale * s;
    if (wpx < 0.6) return;
    const px = view.sx(x, z), py = view.sy(z);
    if (px + wpx < -60 || px - wpx > view.W + 60) return;
    emit(spriteName, px, py, wpx, alpha, sp.anchorY, sp.aspect, additive);
  }
  function pushDyn(sprite, lit, x, z, scale, a, shadow) {
    if (nDyn >= dyn.length || z < 5) return;
    const it = dyn[nDyn++];
    it.sprite = sprite; it.lit = lit; it.x = x; it.z = z;
    it.scale = scale; it.a = a; it.shadow = shadow || 0;
  }

  /* The sun, read from the machine clock and recomputed every 20 s — it moves
   * a quarter of a degree in that time, and this way the trig is not 20 times
   * a second for nothing. */
  let sunAt = -1e9, sunEl = { el: 0, az: 180 };
  function sunElevation() {
    const ms = Date.now();
    if (ms - sunAt < 20000) return sunEl;
    sunAt = ms;
    const date = new Date(ms);
    if (d.forceHour !== null) {
      date.setHours(Math.floor(d.forceHour), Math.round((d.forceHour % 1) * 60), 0, 0);
    }
    sunEl = solarElevation(date, d.lat, d.lon);
    return sunEl;
  }

  /* --- lighting: the real sun over this machine's clock ------------------
   * Elevation above 8 deg is full day, below -8 deg is night, and the band
   * between is twilight — warmest as the sun crosses the horizon. The colony
   * is therefore lit the way the room is, which is the point. */
  function lighting(elevationDeg) {
    const el = elevationDeg;
    let lum;
    if (el >= 8) lum = 1;
    else if (el <= -8) lum = 0.14;
    else lum = 0.14 + 0.86 * smooth((el + 8) / 16);
    const warm = clamp(1 - Math.abs(el) / 9, 0, 1) * 0.9;
    const nf = clamp((1 - lum) * 1.25, 0, 1);
    // Multiply colour: neutral at noon, amber at the edges, deep blue at night.
    const dayR = 1, dayG = 1, dayB = 1;
    const nightR = 0.30, nightG = 0.37, nightB = 0.60;
    const k = clamp((1 - lum) / 0.8, 0, 1);
    let r = lerp(dayR, nightR, k), g2 = lerp(dayG, nightG, k), b = lerp(dayB, nightB, k);
    r = Math.min(1.06, r + warm * 0.26); g2 += warm * 0.05; b -= warm * 0.16;
    return { lum, nf, warm, mul: [clamp(r, 0, 1.2), clamp(g2, 0, 1.2), clamp(b, 0, 1.2)] };
  }

  /* --- event timetable --------------------------------------------------- */
  const DUR = { build: 6.5, haul: 13, gather: 15, expedition: 17, survey: 11, incursion: 9.5 };
  const ev = d.events.map((e, i) => {
    const h = fnv1a('ev' + i + e.kind + e.t);
    return { ...e, start: e.t * CFG.loopSec, dur: DUR[e.kind] || 8, h, r: (h % 1000) / 1000 };
  });

  /* Walk-cycle frame from distance covered, so feet match speed. */
  const CREW = ['crew', 'crewB', 'crewC'];
  function crewSprite(v, dist, moving) {
    const p = CREW[v % 3];
    if (!moving) return p + '0';
    return p + (Math.floor(dist * 1.35) & 3);
  }

  /* ----------------------------------------------------------------- build */
  function frame(now) {
    nBase = 0; nAdd = 0; nDyn = 0;
    const t = (now % CFG.loopSec) / CFG.loopSec;
    const S = sunElevation();
    const L = lighting(S.el);

    /* -- sky: the sun where it actually is, and drifting high cloud -------
     * The top third was the emptiest part of the frame once the ground was
     * detailed. Seven instances buy a sun, its halo, and a cloud deck. */
    {
      // Azimuth 180 (due south) sits at frame centre; the sun tracks across.
      const sx = view.W * 0.5 + ((S.az - 180) / 95) * view.W * 0.5;
      const sy = view.hcurve(sx) - clamp(S.el / 58, -0.08, 1) * view.horizonY * 0.92;
      if (S.el > -7 && sx > -view.W * 0.2 && sx < view.W * 1.2) {
        const rise = clamp(1 - Math.abs(S.el) / 14, 0, 1);   // fat and warm near the horizon
        const r = view.H * (0.012 + rise * 0.009);
        emit('glow', sx, sy, r * (14 + rise * 12), 0.09 + 0.2 * rise, 0.5, 1, true);
        emit('flash', sx, sy, r * 4.5, 0.3 + 0.35 * rise, 0.5, 1, true);
        emit('flash', sx, sy, r * 1.15, 1, 0.5, 1, true);
      }
      for (let k = 0; k < 5; k++) {
        const seed = (k * 0.6180339887) % 1;
        const u = ((now * (0.0016 + seed * 0.0022) + seed) % 1.25) - 0.125;
        const cx = u * view.W;
        const cy = view.horizonY * (0.16 + seed * 0.6);
        const cw = view.W * (0.16 + seed * 0.2);
        emit('cloud' + (k % 2), cx, cy, cw, (0.1 + 0.14 * seed) * (0.4 + 0.6 * L.lum),
             0.5, SP['cloud' + (k % 2)].aspect, false);
      }
    }

    /* -- structures. Lit windows come up as the light goes down. --------- */
    for (const s of world.sites) {
      pushDyn(s.sprite, SP[s.sprite + '_lit'] ? s.sprite + '_lit' : '',
              s.x, s.z, s.scale, 1, s.flat ? 0 : 0.5);
    }

    /* -- terraforming rigs breathe vapour -------------------------------- */
    for (const s of world.sites) {
      if (s.sprite !== 'rig') continue;
      const sp = SP.rig;
      const topZ = s.z;
      for (let k = 0; k < 3; k++) {
        const ph = ((now * 0.22 + k * 0.33 + s.x * 0.01) % 1);
        const sc = (0.5 + ph * 1.9) * s.scale * 2.4;
        const lift = sp.metres * sp.aspect * s.scale * (0.76 + ph * 0.5);
        const scale2 = view.scaleAt(topZ);
        emit('vapor', view.sx(s.x, topZ), view.sy(topZ) - lift * scale2,
             sc * scale2 * 3, (1 - ph) * 0.5, 0.5, 1, true);
      }
    }

    /* -- the people ------------------------------------------------------ */
    for (let i = 0; i < world.crew.length; i++) {
      const c = world.crew[i];
      const u = ((now / c.period) + c.phase) % 1;
      // Out, dwell, back, dwell — a working day, not a commute schedule.
      let f, moving = true;
      const d1 = c.dwell * 0.5;
      if (u < 0.5 - d1) f = u / (0.5 - d1);
      else if (u < 0.5) { f = 1; moving = false; }
      else if (u < 1 - d1) f = 1 - (u - 0.5) / (0.5 - d1);
      else { f = 0; moving = false; }
      const ease = smooth(clamp(f, 0, 1));
      const x = lerp(c.ax, c.bx, ease), z = lerp(c.az, c.bz, ease);
      const dist = (now / c.period + c.phase) * 24;
      let sprite;
      if (!moving) {
        // Standing: at a work site they work, at the plaza they mill about.
        sprite = (f > 0.5 && c.home !== world.plaza) ? 'crewWork' : crewSprite(c.v, 0, false);
      } else if (c.carry) {
        sprite = CREW[c.v % 3] + 'Carry';
      } else sprite = crewSprite(c.v, dist, true);
      pushDyn(sprite, '', x, z, c.sz, 1, 1);
      // Headlamp after dark. Nobody works in the dark unlit.
      if (L.nf > 0.25) {
        const sc = view.scaleAt(z);
        emit('glow', view.sx(x, z), view.sy(z) - 1.6 * sc, 2.6 * sc, L.nf * 0.22, 0.5, 1, true);
      }
    }

    /* -- the vehicles ---------------------------------------------------- */
    for (const v of world.vehicles) {
      const u = ((now / v.period) + v.phase) % 1;
      const f = u < 0.5 ? u * 2 : 2 - u * 2;
      const ease = smooth(f);
      const x = lerp(v.ax, v.bx, ease), z = lerp(v.az, v.bz, ease);
      pushDyn(v.sprite, '', x, z, v.scale, 1, 1);
      const sc = view.scaleAt(z);
      // Dust kicked up behind the wheels — a pure function of position.
      for (let k = 0; k < 3; k++) {
        const ph = ((now * 0.5 + k * 0.34) % 1);
        const back = (u < 0.5 ? -1 : 1) * (1.6 + ph * 3.4);
        emit('puff', view.sx(x + back, z), view.sy(z) - 0.7 * sc,
             (1.4 + ph * 3.4) * sc, (1 - ph) * 0.3, 0.5, 1, false);
      }
      if (L.nf > 0.2) {
        const dir = u < 0.5 ? 1 : -1;
        emit('glow', view.sx(x + dir * 2.4, z), view.sy(z) - 1.4 * sc,
             5 * sc, L.nf * 0.26, 0.5, 1, true);
      }
    }

    /* -- lamp posts on the plaza and at the lander ----------------------- */
    if (L.nf > 0.05) {
      for (const s of [world.lander, world.plaza]) {
        const sc = view.scaleAt(s.z);
        emit('glow', view.sx(s.x, s.z), view.sy(s.z) - 3 * sc,
             9 * sc * s.scale, L.nf * 0.34, 0.5, 1, true);
      }
    }

    /* -- events ---------------------------------------------------------- */
    const tSec = t * CFG.loopSec;
    for (let i = 0; i < ev.length; i++) {
      const e = ev[i];
      let local = tSec - e.start;
      if (local < 0) local += CFG.loopSec;          // wrapped from last pass
      if (local > e.dur) continue;
      const p = local / e.dur;                       // 0..1 through the beat
      runEvent(e, p, local, now, L);
    }

    /* -- weather: blowing dust or drifting spores, in screen space -------
     * Ambient only. It says what the planet is like, never how the week went. */
    if (d.planet.weather !== 'clear') {
      const spore = d.planet.weather === 'spores';
      const N = spore ? 34 : 46;
      for (let k = 0; k < N; k++) {
        const seed = (k * 0.6180339887) % 1;
        const speed = spore ? 0.012 + seed * 0.02 : 0.05 + seed * 0.06;
        const u = ((now * speed + seed * 7.3) % 1);
        const yv = (seed * 13.7) % 1;
        const px = spore ? u * (view.W + 120) - 60 : (1 - u) * (view.W + 160) - 80;
        const py = view.horizonY + yv * (view.H - view.horizonY)
                 + (spore ? Math.sin(now * 0.7 + k) * 14 : 0);
        const sz = (spore ? 3 : 4) + seed * (spore ? 4 : 9);
        const a = (spore ? 0.4 : 0.16) * (0.35 + 0.65 * Math.sin(Math.PI * u));
        emit(spore ? 'glow' : 'puff', px, py, sz * (spore ? 1.6 : 2.6), a, 0.5, 1, spore);
      }
    }

    /* -- depth sort and emit --------------------------------------------- */
    // Insertion sort: the list is near-sorted between frames and short.
    for (let i = 1; i < nDyn; i++) {
      const it = dyn[i];
      let j = i - 1;
      while (j >= 0 && dyn[j].z < it.z) { dyn[j + 1] = dyn[j]; j--; }
      dyn[j + 1] = it;
    }
    // Where the sun is, in screen terms, and how long a shadow it throws.
    const sunX = view.W * 0.5 + ((S.az - 180) / 95) * view.W * 0.5;
    const stretch = clamp(1 / Math.tan(Math.max(S.el, 5) * Math.PI / 180), 0.45, 3.4);
    const shadowA = 0.34 * L.lum * clamp(S.el / 10, 0, 1);

    for (let i = 0; i < nDyn; i++) {
      const it = dyn[i];
      if (it.shadow > 0 && shadowA > 0.01) {
        const sp = SP[it.sprite];
        const sc = view.scaleAt(it.z);
        if (sp) {
          const wpx = sp.metres * it.scale * sc;
          const hpx = wpx * sp.aspect;
          const px = view.sx(it.x, it.z);
          const away = px >= sunX ? 1 : -1;        // the shadow falls away from the sun
          const reach = hpx * 0.3 * stretch;
          emit('shadow', px + away * reach, view.sy(it.z) + hpx * 0.04,
               (wpx * 0.9 + reach * 1.5) * it.shadow,
               shadowA / (0.7 + stretch * 0.3), 0.5,
               SP.shadow.aspect, false);
        }
      }
      world2(it.sprite, it.x, it.z, it.scale, it.a, false);
      if (it.lit && L.nf > 0.02) world2(it.lit, it.x, it.z, it.scale, L.nf * 0.5, true);
    }
    return { nBase, nAdd, base, add, L, t };
  }

  /* ------------------------------------------------------------- event work
   * Every beat is something being done, started or met. None of them damages
   * anything, and nothing is left worse off at the end of the loop. */
  function runEvent(e, p, local, now, L) {
    const sc0 = (z) => view.scaleAt(z);
    switch (e.kind) {

      /* A frame goes up, a shell closes. Sparks, a work light, two welders. */
      case 'build': {
        const site = world.builds.length ? world.builds[e.h % world.builds.length] : world.lander;
        const sc = sc0(site.z);
        const sp = SP[site.sprite] || SP.hab;
        const topY = view.sy(site.z) - sp.metres * sp.aspect * site.scale * sc * 0.75;
        const flick = 0.55 + 0.45 * Math.sin(local * 34 + e.r * 9);
        const fade = Math.sin(Math.PI * clamp(p, 0, 1));
        emit('flash', view.sx(site.x, site.z), topY,
             (3.5 + 3.5 * e.magnitude) * sc, fade * flick * 0.8, 0.5, 1, true);
        // Sparks arc off and fall. Pure function of local time — no particles.
        for (let k = 0; k < 9; k++) {
          const age = (local * 2.1 + k * 0.37) % 1;
          const a = (k * 2.399 + e.r * 6.28);
          const dx = Math.cos(a) * age * 7 * e.magnitude;
          const dy = Math.sin(a) * age * 5 - 9 * age + 16 * age * age;
          emit('spark', view.sx(site.x + dx, site.z), topY + dy * sc,
               1.9 * sc, (1 - age) * fade, 0.5, 1, true);
        }
        for (let k = 0; k < 2; k++) {
          pushDyn('crewWork', '', site.x + (k ? 3.4 : -3.6), site.z + (k ? 1.2 : -0.8), 1, 1, 1);
        }
        break;
      }

      /* A hauler runs cargo in from the frontier. */
      case 'haul': {
        const far = world.pads.length ? world.pads[e.h % world.pads.length]
                                      : { x: 0, z: world.zFar };
        const f = smooth(p);
        const x = lerp(far.x, world.lander.x, f), z = lerp(far.z, world.lander.z, f);
        pushDyn('hauler', '', x, z, 1, clamp(p * 6, 0, 1) * clamp((1 - p) * 6, 0, 1), 1);
        const sc = sc0(z);
        for (let k = 0; k < 4; k++) {
          const ph = ((local * 0.6 + k * 0.25) % 1);
          emit('puff', view.sx(x + 2 + ph * 5, z), view.sy(z) - 0.8 * sc,
               (2 + ph * 5) * sc, (1 - ph) * 0.34, 0.5, 1, false);
        }
        break;
      }

      /* People gather on the plaza. The only thing being produced is company. */
      case 'gather': {
        const n = 3 + Math.round(5 * e.magnitude);
        const pz = world.plaza;
        const grow = clamp(p * 4, 0, 1) * clamp((1 - p) * 4, 0, 1);
        for (let k = 0; k < n; k++) {
          const a = (k / n) * TAU + e.r * 6.28 + now * 0.05;
          const r = 4 + 5 * ((k * 37 % 13) / 13);
          const x = pz.x + Math.cos(a) * r, z = pz.z + Math.sin(a) * r * 0.42;
          const wave = ((k + Math.floor(local * 0.7)) % 3 === 0);
          pushDyn(wave ? 'crewWave' : crewSprite(k, 0, false), '', x, z,
                  0.92 + ((k * 13) % 7) / 40, grow, 1);
        }
        const sc = sc0(pz.z);
        emit('glow', view.sx(pz.x, pz.z), view.sy(pz.z) - 6 * sc,
             12 * sc, grow * (0.1 + L.nf * 0.3), 0.5, 1, true);
        break;
      }

      /* An expedition leaves for the undeveloped ground, over the horizon.
       * This is what reaching outward looks like; it is not a departure from
       * anything and nothing is abandoned. */
      case 'expedition': {
        const f = smooth(p);
        const outX = (e.r - 0.5) * 2 * view.halfWidthAt(world.zFar) * 1.1;
        const x = lerp(world.lander.x, outX, f);
        const z = lerp(world.lander.z, world.zFar + world.depthSpan * 0.9, f);
        const fade = clamp((1 - p) * 3.4, 0, 1) * clamp(p * 8, 0, 1);
        pushDyn('rover', '', x, z, 0.95, fade, 1);
        if (p < 0.55) {
          pushDyn(crewSprite(0, now * 2, true), '', x - 3.4, z + 1.1, 1, fade, 1);
          pushDyn(crewSprite(2, now * 2 + 0.5, true), '', x + 3.6, z - 0.6, 1, fade, 1);
        }
        const sc = sc0(z);
        for (let k = 0; k < 3; k++) {
          const ph = ((local * 0.5 + k * 0.33) % 1);
          emit('puff', view.sx(x - 3 - ph * 4, z), view.sy(z) - 0.7 * sc,
               (2 + ph * 6) * sc, (1 - ph) * 0.3 * fade, 0.5, 1, false);
        }
        break;
      }

      /* A survey drone crosses, reading the ground. */
      case 'survey': {
        const z = lerp(world.zNear + 8, world.zFar, e.r);
        const span = view.halfWidthAt(z) * 1.05;
        const dir = (e.h & 1) ? 1 : -1;
        const x = lerp(-span * dir, span * dir, smooth(p));
        const sc = sc0(z);
        const bob = Math.sin(local * 3.1) * 0.6;
        const fade = clamp(p * 7, 0, 1) * clamp((1 - p) * 7, 0, 1);
        const py = view.sy(z) - (7 + bob) * sc;
        emit('drone', view.sx(x, z), py, SP.drone.metres * sc, fade, SP.drone.anchorY,
             SP.drone.aspect, false);
        emit('zap', view.sx(x, z), view.sy(z), 4.5 * sc, fade * 0.3, 0.5, 1, true);
        emit('glow', view.sx(x, z), py, 3 * sc, fade * (0.3 + L.nf * 0.5), 0.5, 1, true);
        break;
      }

      /* Local fauna wanders in at the perimeter and is politely shooed off.
       * Nothing is damaged, no colonist is hurt, and the critters are fine —
       * they turn up again next week. Downtime on the host is the only thing
       * that puts this beat on the timetable, which is a fact about the
       * machine and never about the week. */
      case 'incursion': {
        const n = 2 + Math.round(2 * e.magnitude);
        const z0 = world.zFar - 18;
        const bx = (e.r - 0.5) * 1.6 * view.halfWidthAt(z0);
        const approach = clamp(p / 0.45, 0, 1);
        const retreat = clamp((p - 0.6) / 0.4, 0, 1);
        const push = smooth(approach) - smooth(retreat) * 1.5;
        for (let k = 0; k < n; k++) {
          const off = (k - (n - 1) / 2) * 4.2;
          const x = bx + off, z = z0 - push * 12 + (k % 2) * 1.6;
          const spr = 'critter' + (Math.floor(local * 5 + k) & 1);
          pushDyn(spr, '', x, z, 0.9 + 0.3 * ((k * 7 % 5) / 5),
                  clamp(p * 6, 0, 1) * clamp((1 - p) * 4, 0, 1), 1);
        }
        // A colonist steps up and zaps. Bright, brief, harmless.
        const gx = bx + 5, gz = z0 - 16;
        pushDyn('crewWork', '', gx, gz, 1, clamp(p * 5, 0, 1), 1);
        if (p > 0.3 && p < 0.72) {
          const sc = sc0(gz);
          const flick = 0.4 + 0.6 * Math.abs(Math.sin(local * 26));
          // A thin beam, not a row of lamps: many small segments beat a few
          // fat ones, and it has to stay readable against a lit night town.
          for (let k = 0; k < 10; k++) {
            const f = k / 9;
            emit('zap', view.sx(lerp(gx, bx, f), lerp(gz, z0, f)),
                 view.sy(lerp(gz, z0, f)) - (2.6 - f * 1.4) * sc,
                 1.5 * sc, flick * 0.3 * (1 - f * 0.35), 0.5, 1, true);
          }
        }
        break;
      }
    }
  }

  return { frame, lighting };
}

/* ===========================================================================
 *  RENDER PATH A — WebGL2, one instanced draw per pass.
 *
 *  Pass order: backdrop quad, base sprites, a multiply quad for the time of
 *  day, additive sprites (window light, lamps, sparks, vapour). The atlas is
 *  uploaded premultiplied, so a single alpha multiply in the shader is correct
 *  for both the normal and the additive pass.
 * ======================================================================== */

const VS = `#version 300 es
in vec2 aCorner;
in vec2 aXY;
in vec2 aWH;
in vec4 aUV;
in float aA;
uniform vec2 uRes;
out vec2 vUV;
out float vA;
void main() {
  vec2 p = aXY + (aCorner - 0.5) * aWH;
  gl_Position = vec4(p.x / uRes.x * 2.0 - 1.0, 1.0 - p.y / uRes.y * 2.0, 0.0, 1.0);
  vUV = aUV.xy + aCorner * aUV.zw;
  vA = aA;
}`;

const FS = `#version 300 es
precision mediump float;
in vec2 vUV;
in float vA;
uniform sampler2D uTex;
uniform vec4 uTint;
out vec4 o;
void main() {
  o = texture(uTex, vUV) * vA * uTint;
}`;

const FLOATS = 9;   // x, y, w, h, u0, v0, du, dv, a

function makeGL(canvas, atlasCanvas) {
  const gl = canvas.getContext('webgl2', {
    alpha: false, antialias: false, depth: false, stencil: false,
    premultipliedAlpha: true, preserveDrawingBuffer: false,
    powerPreference: 'low-power'
  });
  if (!gl) return null;

  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.warn('landfall: shader failed —', gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }
  const vs = shader(gl.VERTEX_SHADER, VS), fs = shader(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return null;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.warn('landfall: link failed —', gl.getProgramInfoLog(prog));
    return null;
  }
  gl.useProgram(prog);

  const loc = {
    corner: gl.getAttribLocation(prog, 'aCorner'),
    xy: gl.getAttribLocation(prog, 'aXY'),
    wh: gl.getAttribLocation(prog, 'aWH'),
    uv: gl.getAttribLocation(prog, 'aUV'),
    a: gl.getAttribLocation(prog, 'aA'),
    res: gl.getUniformLocation(prog, 'uRes'),
    tint: gl.getUniformLocation(prog, 'uTint'),
    tex: gl.getUniformLocation(prog, 'uTex')
  };

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(loc.corner);
  gl.vertexAttribPointer(loc.corner, 2, gl.FLOAT, false, 0, 0);

  const cap = CFG.maxInstances + 1200;
  const data = new Float32Array(cap * FLOATS);
  const ibuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ibuf);
  gl.bufferData(gl.ARRAY_BUFFER, data.byteLength, gl.DYNAMIC_DRAW);
  const stride = FLOATS * 4;
  const attr = (l, size, off) => {
    gl.enableVertexAttribArray(l);
    gl.vertexAttribPointer(l, size, gl.FLOAT, false, stride, off * 4);
    gl.vertexAttribDivisor(l, 1);
  };
  attr(loc.xy, 2, 0); attr(loc.wh, 2, 2); attr(loc.uv, 4, 4); attr(loc.a, 1, 8);

  function texFrom(src, premultiply) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, !!premultiply);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  const atlasTex = texFrom(atlasCanvas, true);
  let backTex = null;

  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.uniform1i(loc.tex, 0);

  let nUp = 0;
  function fill(list, n, sprites, atlasSize) {
    nUp = 0;
    for (let i = 0; i < n && nUp < cap; i++) {
      const it = list[i];
      const sp = sprites[it.s];
      if (!sp) continue;
      const o = nUp * FLOATS;
      data[o] = it.x; data[o + 1] = it.y;
      data[o + 2] = it.w; data[o + 3] = it.h;
      // Half-texel inset: stops a neighbour bleeding in under LINEAR filtering.
      data[o + 4] = (sp.x + 0.5) / atlasSize;
      data[o + 5] = (sp.y + 0.5) / atlasSize;
      data[o + 6] = (sp.w - 1) / atlasSize;
      data[o + 7] = (sp.h - 1) / atlasSize;
      data[o + 8] = it.a;
      nUp++;
    }
    if (!nUp) return 0;
    gl.bindBuffer(gl.ARRAY_BUFFER, ibuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, data, 0, nUp * FLOATS);
    return nUp;
  }

  return {
    gl, lost: false,
    setBackdrop(cv) {
      if (backTex) gl.deleteTexture(backTex);
      backTex = texFrom(cv, false);
    },
    resize(w, h) {
      gl.viewport(0, 0, w, h);
      gl.useProgram(prog);
      gl.uniform2f(loc.res, w, h);
    },
    draw(f, sprites, W, H) {
      gl.bindVertexArray(vao);
      gl.useProgram(prog);
      gl.clearColor(0.02, 0.03, 0.05, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      // 1 — backdrop
      if (backTex) {
        gl.blendFunc(gl.ONE, gl.ZERO);
        gl.bindTexture(gl.TEXTURE_2D, backTex);
        gl.uniform4f(loc.tint, 1, 1, 1, 1);
        const o = 0;
        data[o] = W / 2; data[o + 1] = H / 2; data[o + 2] = W; data[o + 3] = H;
        data[o + 4] = 0; data[o + 5] = 0; data[o + 6] = 1; data[o + 7] = 1;
        data[o + 8] = 1;
        gl.bindBuffer(gl.ARRAY_BUFFER, ibuf);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, data, 0, FLOATS);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, 1);
      }

      // 2 — base sprites
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.bindTexture(gl.TEXTURE_2D, atlasTex);
      gl.uniform4f(loc.tint, 1, 1, 1, 1);
      let n = fill(f.base, f.nBase, sprites, ATLAS_SIZE);
      if (n) gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);

      // 3 — time of day, as a multiply over everything drawn so far
      const m = f.L.mul;
      if (m[0] < 0.995 || m[1] < 0.995 || m[2] < 0.995) {
        gl.blendFunc(gl.ZERO, gl.SRC_COLOR);
        gl.uniform4f(loc.tint, m[0], m[1], m[2], 1);
        const sp = sprites.px;
        const o = 0;
        data[o] = W / 2; data[o + 1] = H / 2; data[o + 2] = W; data[o + 3] = H;
        data[o + 4] = (sp.x + 2) / ATLAS_SIZE; data[o + 5] = (sp.y + 2) / ATLAS_SIZE;
        data[o + 6] = (sp.w - 4) / ATLAS_SIZE; data[o + 7] = (sp.h - 4) / ATLAS_SIZE;
        data[o + 8] = 1;
        gl.bindBuffer(gl.ARRAY_BUFFER, ibuf);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, data, 0, FLOATS);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, 1);
      }

      // 4 — lights
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.uniform4f(loc.tint, 1, 1, 1, 1);
      n = fill(f.add, f.nAdd, sprites, ATLAS_SIZE);
      if (n) gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
    }
  };
}

/* ===========================================================================
 *  RENDER PATH B — Canvas 2D. Same instance list, same pass order. Taken when
 *  WebGL2 is unavailable, the shaders fail, or the context is lost at runtime.
 * ======================================================================== */

function makeC2D(canvas, atlasCanvas) {
  const g = canvas.getContext('2d');
  let backdrop = null;
  return {
    setBackdrop(cv) { backdrop = cv; },
    resize() { },
    draw(f, sprites, W, H) {
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalCompositeOperation = 'source-over';
      g.globalAlpha = 1;
      if (backdrop) g.drawImage(backdrop, 0, 0, W, H);
      else { g.fillStyle = '#05070c'; g.fillRect(0, 0, W, H); }

      for (let i = 0; i < f.nBase; i++) {
        const it = f.base[i], sp = sprites[it.s];
        if (!sp || it.a <= 0.004) continue;
        g.globalAlpha = it.a > 1 ? 1 : it.a;
        g.drawImage(atlasCanvas, sp.x, sp.y, sp.w, sp.h,
                    it.x - it.w / 2, it.y - it.h / 2, it.w, it.h);
      }

      const m = f.L.mul;
      if (m[0] < 0.995 || m[1] < 0.995 || m[2] < 0.995) {
        g.globalAlpha = 1;
        g.globalCompositeOperation = 'multiply';
        g.fillStyle = `rgb(${Math.round(m[0] * 255)} ${Math.round(m[1] * 255)} ${Math.round(m[2] * 255)})`;
        g.fillRect(0, 0, W, H);
      }

      g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < f.nAdd; i++) {
        const it = f.add[i], sp = sprites[it.s];
        if (!sp || it.a <= 0.004) continue;
        g.globalAlpha = it.a > 1 ? 1 : it.a;
        g.drawImage(atlasCanvas, sp.x, sp.y, sp.w, sp.h,
                    it.x - it.w / 2, it.y - it.h / 2, it.w, it.h);
      }
      g.globalCompositeOperation = 'source-over';
      g.globalAlpha = 1;
    }
  };
}

/* ===========================================================================
 *  BOOT
 * ======================================================================== */

(function main() {
  const canvas = document.getElementById('c');
  const q = new URLSearchParams(location.search);
  const qNum = (k, lo, hi) => {
    const v = parseFloat(q.get(k));
    return isFinite(v) ? clamp(v, lo, hi) : null;
  };

  const data = readData();
  // Debug overrides, for screenshotting a specific moment or previewing how
  // another week's planet and temper would read. Never used by the wallpaper.
  const oTemper = qNum('temper', -1, 1);
  if (oTemper !== null) data.temper = oTemper;
  for (const k of ['extent', 'bustle', 'industry', 'community', 'terraform']) {
    const v = qNum(k, 0, 1);
    if (v !== null) data.colony[k] = v;
  }
  if (q.get('seed')) {
    const s = fnv1a('landfall|' + q.get('seed'));
    const r = mulberry32(s);
    data.seed = s;
    data.planet = {
      skyHue: Math.floor(r() * 360), groundHue: Math.floor(r() * 360),
      rockHue: Math.floor(r() * 360), vegHue: 90 + Math.floor(r() * 110),
      terrain: ['dunes', 'ridges', 'craters', 'flats'][Math.floor(r() * 4)],
      moons: Math.floor(r() * 3), ring: r() < 0.35,
      weather: ['clear', 'dust', 'spores'][Math.floor(r() * 3)]
    };
  }
  // Where the sun is read from, and an override for screenshotting a time of
  // day. `?hour=21.5` is 9:30pm local.
  data.lat = qNum('lat', -90, 90);
  data.lon = qNum('lon', -180, 180);
  if (data.lat === null) data.lat = CFG.lat;
  if (data.lon === null) data.lon = CFG.lon;
  data.forceHour = qNum('hour', 0, 24);

  const fpsCap = qNum('fps', 1, 60) || CFG.fps;
  const t0 = qNum('t', 0, 1e6) || 0;

  const PAL = buildPalette(data);
  const atlas = makeAtlas(PAL, mulberry32(data.seed));

  let renderer = q.get('gl') === '0' ? null : makeGL(canvas, atlas.canvas);
  let usingGL = !!renderer;
  if (!renderer) renderer = makeC2D(canvas, atlas.canvas);

  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    if (!usingGL) return;
    console.warn('landfall: WebGL context lost — falling back to Canvas 2D');
    usingGL = false;
    renderer = makeC2D(canvas, atlas.canvas);
    layout(true);
  }, false);

  let W = 0, H = 0, view = null, world = null, scene = null, backdrop = null;

  function layout(force) {
    const dpr = Math.min(window.devicePixelRatio || 1, CFG.dprMax);
    const w = Math.max(320, Math.round(window.innerWidth * dpr));
    const h = Math.max(240, Math.round(window.innerHeight * dpr));
    if (!force && w === W && h === H) return;
    W = w; H = h;
    canvas.width = W; canvas.height = H;
    view = makeView(W, H);
    world = buildWorld(data, view, atlas);
    scene = makeScene(data, world, atlas);
    backdrop = bakeBackdrop(data, world, atlas, PAL, W, H);
    renderer.resize(W, H);
    renderer.setBackdrop(backdrop);
  }
  layout(true);

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => layout(false), 150);
  });

  /* Time-gated rAF: 20 fps by default, and the browser parks rAF entirely when
   * the desktop is occluded or minimized, so an idle wallpaper costs nothing. */
  const interval = 1000 / fpsCap;
  let last = -1e9;
  const started = performance.now();
  let perfSum = 0, perfN = 0, perfMax = 0, perfInst = 0, perfAdd = 0;

  function tick(ts) {
    requestAnimationFrame(tick);
    if (ts - last < interval - 1) return;
    last = ts;
    const now = t0 + (ts - started) / 1000;
    const t1 = performance.now();
    const f = scene.frame(now);
    renderer.draw(f, atlas.sprites, W, H);
    const cost = performance.now() - t1;
    perfSum += cost; perfN++;
    if (cost > perfMax && perfN > 4) perfMax = cost;
    perfInst = f.nBase; perfAdd = f.nAdd;
  }
  window.LANDFALL_RESET_PERF = () => { perfSum = 0; perfN = 0; perfMax = 0; };
  requestAnimationFrame(tick);

  // A tiny handle for the capture harness and for debugging; nothing reads it
  // in normal operation.
  window.LANDFALL = {
    get info() {
      return { gl: usingGL, planet: data.planet, colony: data.colony,
               temper: data.temper, seed: data.seed,
               sites: world.sites.length, crew: world.crew.length,
               events: data.events.length, size: [W, H],
               sunDeg: Math.round(solarElevation(new Date(), data.lat, data.lon).el * 10) / 10,
               perf: { frames: perfN, avgMs: perfN ? Math.round(perfSum / perfN * 100) / 100 : 0,
                       maxMs: Math.round(perfMax * 100) / 100,
                       instances: perfInst, additive: perfAdd } };
    }
  };
})();
</script>
</body>
</html>
