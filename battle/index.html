<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROB64 — Fleet Action</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #030408; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- data.js is optional; when absent the built-in sample below is used.
     It must set: window.ROB64_DATA = { ... } (see SCHEMA.md) -->
<script src="data.js"></script>
<script>
(function () {
"use strict";

/* =====================================================================
   ROB64 fleet-action wallpaper.
   Canvas 2D, 20 fps cap, seeded PRNG, zero network, zero assets.
   Data contract: window.ROB64_DATA (see SCHEMA.md). Falls back to SAMPLE.
   ===================================================================== */

/* ---------------- built-in fallback data ---------------- */
var SAMPLE = {
  generated: "2026-11-15T20:40:00-05:00",
  window: { start: "2026-11-09", end: "2026-11-15" },
  factions: {
    order:   { name: "Order",   hue: 200, strength: 0.72 },
    entropy: { name: "Entropy", hue: 18,  strength: 0.41 }
  },
  capitals: [
    { id: "ord-1", faction: "order",   size: 0.90, integrity: 0.86, activity: 0.70, label: "VIGIL" },
    { id: "ord-2", faction: "order",   size: 0.55, integrity: 0.93, activity: 0.50, label: "LEDGER" },
    { id: "ent-1", faction: "entropy", size: 0.75, integrity: 0.58, activity: 0.60, label: "BACKLOG" },
    { id: "ent-2", faction: "entropy", size: 0.40, integrity: 0.80, activity: 0.30, label: "DRIFT" }
  ],
  fighters: [
    { id: "f01", faction: "order",   speed: 0.70, aggression: 0.80, lifetime: 0.60 },
    { id: "f02", faction: "order",   speed: 0.55, aggression: 0.60, lifetime: 0.70 },
    { id: "f03", faction: "order",   speed: 0.80, aggression: 0.70, lifetime: 0.40 },
    { id: "f04", faction: "order",   speed: 0.45, aggression: 0.40, lifetime: 0.80 },
    { id: "f05", faction: "order",   speed: 0.65, aggression: 0.75, lifetime: 0.55 },
    { id: "f06", faction: "order",   speed: 0.60, aggression: 0.50, lifetime: 0.65 },
    { id: "f07", faction: "order",   speed: 0.72, aggression: 0.66, lifetime: 0.50 },
    { id: "f08", faction: "order",   speed: 0.50, aggression: 0.35, lifetime: 0.75 },
    { id: "f09", faction: "entropy", speed: 0.60, aggression: 0.55, lifetime: 0.50 },
    { id: "f10", faction: "entropy", speed: 0.75, aggression: 0.65, lifetime: 0.45 },
    { id: "f11", faction: "entropy", speed: 0.40, aggression: 0.30, lifetime: 0.70 },
    { id: "f12", faction: "entropy", speed: 0.55, aggression: 0.50, lifetime: 0.60 },
    { id: "f13", faction: "entropy", speed: 0.68, aggression: 0.45, lifetime: 0.55 }
  ],
  events: [
    { t: 0.06, faction: "order",   kind: "launch", magnitude: 0.5 },
    { t: 0.14, faction: "order",   kind: "strike", magnitude: 0.7 },
    { t: 0.22, faction: "entropy", kind: "strike", magnitude: 0.4 },
    { t: 0.31, faction: "entropy", kind: "loss",   magnitude: 0.6 },
    { t: 0.42, faction: "order",   kind: "strike", magnitude: 0.5 },
    { t: 0.50, faction: "entropy", kind: "launch", magnitude: 0.4 },
    { t: 0.58, faction: "entropy", kind: "strike", magnitude: 0.6 },
    { t: 0.66, faction: "order",   kind: "loss",   magnitude: 0.3 },
    { t: 0.74, faction: "order",   kind: "strike", magnitude: 0.8 },
    { t: 0.83, faction: "entropy", kind: "loss",   magnitude: 0.8 },
    { t: 0.92, faction: "order",   kind: "launch", magnitude: 0.6 }
  ],
  metrics: {
    commits: 23, tasksClosed: 14, tasksOpen: 9,
    minutesLogged: 420, calendarDensity: 0.55, uptimePct: 0.98
  }
};

/* ---------------- helpers ---------------- */
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function num(v, d, a, b) { v = +v; return isFinite(v) ? clamp(v, a, b) : d; }
function strSeed(s) {
  s = String(s || "rob64");
  var h = 2166136261 >>> 0;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hsl2rgb(h, s, l) {
  h = (((h % 360) + 360) % 360) / 30;
  function f(n) {
    var k = (n + h) % 12;
    var a = s * Math.min(l, 1 - l);
    return l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
  }
  return [f(0), f(8), f(4)];
}

/* ---------------- data intake (defensive) ---------------- */
var RAW = (window.ROB64_DATA && typeof window.ROB64_DATA === "object") ? window.ROB64_DATA : SAMPLE;
var SEED = strSeed(RAW.generated);
var rng = mulberry32(SEED);

function mkFaction(key, defHue) {
  var src = (RAW.factions && RAW.factions[key]) || {};
  return {
    key: key,
    name: typeof src.name === "string" ? src.name : key,
    hue: num(src.hue, defHue, 0, 360),
    strength: num(src.strength, 0.5, 0, 1)
  };
}
var FAC = { order: mkFaction("order", 200), entropy: mkFaction("entropy", 18) };

var MET = (RAW.metrics && typeof RAW.metrics === "object") ? RAW.metrics : {};
var mCommits = num(MET.commits, 12, 0, 2000);
var mMinutes = num(MET.minutesLogged, 300, 0, 100000);
var mCal     = num(MET.calendarDensity, 0.5, 0, 1);
var mUp      = num(MET.uptimePct, 1, 0, 1);
var mClosed  = num(MET.tasksClosed, 10, 0, 10000);
var mOpen    = num(MET.tasksOpen, 10, 0, 10000);

var DEBRIS_N   = Math.round(clamp(mCommits, 6, 40));          // commits -> debris count
var ENG_BOOST  = 0.6 + 0.6 * clamp(mMinutes / 600, 0, 1);     // minutesLogged -> engine glow
var BUSY       = 0.6 + 0.8 * mCal;                            // calendarDensity -> fighter busyness
var STAR_BRIGHT= 0.7 + 0.3 * mUp;                             // uptimePct -> star brightness
var LIT_BONUS  = { order: 0.2 * clamp(mClosed / 50, 0, 1),    // tasksClosed -> Order lit windows
                   entropy: 0.2 * clamp(mOpen / 50, 0, 1) };  // tasksOpen -> Entropy lit windows

/* ---- capitals: cap at 4 per side, synthesize one if a side is empty ---- */
var caps = [];
function mkCap(fk, size, integ, act, label) {
  return {
    fac: fk, size: size, integ: integ, act: act, label: label,
    seed: (rng() * 4294967296) >>> 0,
    jPerp: (rng() - 0.5) * 0.05, jAlong: (rng() - 0.5) * 0.10,
    angDev: (rng() - 0.5) * 0.26,
    wA: 6.283 / (60 + rng() * 80), wB: 6.283 / (70 + rng() * 90), wY: 6.283 / (90 + rng() * 120),
    dphA: rng() * 6.283, dphB: rng() * 6.283, dphY: rng() * 6.283,
    yawAmp: 0.035 + rng() * 0.03,
    ax: 0, ay: 0, baseAng: 0, len: 10,
    x: 0, y: 0, ang: 0,
    sprite: null, sw: 0, sh: 0, outline: null,
    eng: [], lights: [], embers: [], rcs: []
  };
}
(function intakeCapitals() {
  var raw = Array.isArray(RAW.capitals) ? RAW.capitals : [];
  var count = { order: 0, entropy: 0 };
  for (var i = 0; i < raw.length && caps.length < 8; i++) {
    var c = raw[i];
    if (!c) continue;
    var fk = c.faction === "entropy" ? "entropy" : (c.faction === "order" ? "order" : null);
    if (!fk || count[fk] >= 4) continue;
    count[fk]++;
    caps.push(mkCap(fk,
      num(c.size, 0.5, 0, 1), num(c.integrity, 1, 0, 1), num(c.activity, 0.5, 0, 1),
      typeof c.label === "string" ? c.label.slice(0, 12) : ""));
  }
  var sides = ["order", "entropy"];
  for (var s = 0; s < 2; s++) {
    if (!count[sides[s]]) caps.push(mkCap(sides[s], 0.6, 0.4 + 0.5 * FAC[sides[s]].strength, 0.5, ""));
  }
})();
var CAPF = { order: [], entropy: [] };
for (var ci = 0; ci < caps.length; ci++) CAPF[caps[ci].fac].push(ci);
function randCapIdx(fk) { var a = CAPF[fk]; return a[(rng() * a.length) | 0]; }

/* ---- fighters: hard cap 48 instantiated, synthesize from strength if absent ---- */
var FTR_MAX = 48, TRAIL = 24;
var ftrs = [];
function mkFighter(fk, speed, agg, life) {
  return {
    fac: fk, spd01: speed, agg: agg, life: life,
    spd: 40, x: 0, y: 0, vx: 0, vy: 0, wx: 0, wy: 0,
    mode: 0, tgt: -1, cd: 2 + rng() * 4,
    timer: 20 + rng() * 60 + life * 120, fadeIn: 1,
    front: rng() < 0.6,
    trail: new Float32Array(TRAIL * 2), ti: 0
  };
}
(function intakeFighters() {
  var raw = Array.isArray(RAW.fighters) ? RAW.fighters : null;
  if (raw) {
    for (var i = 0; i < raw.length && ftrs.length < FTR_MAX; i++) {
      var f = raw[i];
      if (!f) continue;
      var fk = f.faction === "entropy" ? "entropy" : (f.faction === "order" ? "order" : null);
      if (!fk) continue;
      ftrs.push(mkFighter(fk, num(f.speed, 0.5, 0, 1), num(f.aggression, 0.5, 0, 1), num(f.lifetime, 0.5, 0, 1)));
    }
  }
  if (!ftrs.length) {
    var sides = ["order", "entropy"];
    for (var s = 0; s < 2; s++) {
      var n = Math.round(6 + 16 * FAC[sides[s]].strength);
      for (var j = 0; j < n && ftrs.length < FTR_MAX; j++) {
        ftrs.push(mkFighter(sides[s], 0.3 + rng() * 0.6, 0.2 + rng() * 0.7, 0.3 + rng() * 0.6));
      }
    }
  }
})();

/* ---- events: cap 64, sorted by loop time ---- */
var EV = [];
(function intakeEvents() {
  var raw = Array.isArray(RAW.events) ? RAW.events : [];
  for (var i = 0; i < raw.length && EV.length < 64; i++) {
    var e = raw[i];
    if (!e) continue;
    EV.push({
      t: num(e.t, 0, 0, 1),
      fac: e.faction === "entropy" ? "entropy" : "order",
      kind: (e.kind === "loss" || e.kind === "launch") ? e.kind : "strike",
      mag: num(e.magnitude, 0.5, 0, 1)
    });
  }
  EV.sort(function (a, b) { return a.t - b.t; });
})();

/* ---------------- pre-rendered glow sprites & colors ---------------- */
function makeGlow(hue, sat) {
  var s = 64, cv = document.createElement("canvas");
  cv.width = cv.height = s;
  var g = cv.getContext("2d");
  var gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "hsla(" + hue + "," + sat + "%,88%,1)");
  gr.addColorStop(0.35, "hsla(" + hue + "," + sat + "%,65%,0.35)");
  gr.addColorStop(1, "hsla(" + hue + "," + sat + "%,60%,0)");
  g.fillStyle = gr;
  g.fillRect(0, 0, s, s);
  return cv;
}
var GLOW = {
  order: makeGlow(FAC.order.hue, 85),
  entropy: makeGlow(FAC.entropy.hue, 85),
  white: makeGlow(0, 0),
  warm: makeGlow(16, 92),           // explosions: hot red-orange beside red weapons fire
  red: makeGlow(5, 95)              // all weapons fire, both factions
};
// fighters read as hot near-white points with only a suggestion of faction hue
var FGLOW = {
  order: makeGlow(FAC.order.hue, 22),
  entropy: makeGlow(FAC.entropy.hue, 22)
};
var COL = {};
(function () {
  var sides = ["order", "entropy"];
  for (var s = 0; s < 2; s++) {
    var h = FAC[sides[s]].hue;
    COL[sides[s]] = {
      trail: "hsla(" + h + ",20%,82%,1)",
      shimmer: "hsla(" + h + ",80%,78%,1)"
    };
  }
})();
var BOLT_COL = "hsl(5,95%,58%)";    // red body under the white-hot core
var EMBER_COL = "hsl(22,90%,55%)";
/* linear-ish RGB triples for the WebGL lit path */
var FRGB = { order: hsl2rgb(FAC.order.hue, 0.9, 0.65), entropy: hsl2rgb(FAC.entropy.hue, 0.9, 0.65) };
var FTR_RGB = { order: hsl2rgb(FAC.order.hue, 0.25, 0.82), entropy: hsl2rgb(FAC.entropy.hue, 0.25, 0.82) };
var BOLT_RGB = hsl2rgb(5, 0.95, 0.58);
var BOLT_LIGHT_RGB = hsl2rgb(5, 0.9, 0.55);
var SHIM_RGB = { order: hsl2rgb(FAC.order.hue, 0.8, 0.78), entropy: hsl2rgb(FAC.entropy.hue, 0.8, 0.78) };
var WARM_RGB = hsl2rgb(16, 0.92, 0.58);
var EMBER_RGB = hsl2rgb(22, 0.9, 0.55);
var RED_RGB = hsl2rgb(5, 0.95, 0.6);
var GLOW_RGB = { warm: WARM_RGB, white: [1, 1, 1], red: RED_RGB, order: FRGB.order, entropy: FRGB.entropy };
var DEBRIS_RGB = [0.26, 0.29, 0.35];

/* ---------------- static ambience (fractional coords, resize-proof) ---------------- */
var DEB = [];   // drifting debris; pos is a periodic function of time (never wanders off)
for (var di = 0; di < DEBRIS_N; di++) {
  DEB.push({
    fx: rng(), fy: rng(), s: 1 + rng() * 1.2,
    dvx: (rng() - 0.5) * 0.008, dvy: (rng() - 0.5) * 0.003
  });
}
var TWK = [];   // stars that twinkle dynamically
for (var ti2 = 0; ti2 < 8; ti2++) {
  TWK.push({ fx: rng(), fy: rng() * 0.95, w: 0.6 + rng() * 1.4, ph: rng() * 6.283 });
}
var DIST = [];  // far depth layer: distant traffic, slow and low-contrast
for (var zi = 0; zi < 10; zi++) {
  var dHue = rng() < 0.5 ? FAC.order.hue : FAC.entropy.hue;
  DIST.push({
    fx: rng(), fy: 0.05 + rng() * 0.85,
    len: 2.5 + rng() * 4.5,
    dvx: (rng() < 0.5 ? -1 : 1) * (0.0008 + rng() * 0.0016),
    col: "hsla(" + dHue + ",18%,62%,1)",
    rgb: hsl2rgb(dHue, 0.18, 0.62)
  });
}
var FARF = [];  // a third fleet at extreme range holding the lower-left:
                // tiny dim bars with a faint engine point — barely resolvable,
                // bounded drift so the formation never wanders off station
for (var ff = 0; ff < 6; ff++) {
  var fHue = rng() < 0.5 ? FAC.order.hue : FAC.entropy.hue;
  FARF.push({
    fx: 0.06 + rng() * 0.22, fy: 0.68 + rng() * 0.24,
    len: 6 + rng() * 8,
    w: 6.283 / (160 + rng() * 140), ph: rng() * 6.283, ph2: rng() * 6.283,
    gper: 9 + rng() * 11, gph: rng(),          // sparse far-off weapon glints
    col: "hsla(" + fHue + ",14%,58%,1)",
    rgb: hsl2rgb(fHue, 0.14, 0.58)
  });
}
var DEBL = [];  // drifting debris field over the lower-left, one layer nearer
                // than the global specks (bigger, brighter, bounded wander)
for (var dl = 0; dl < 14; dl++) {
  DEBL.push({
    fx: 0.02 + rng() * 0.32, fy: 0.62 + rng() * 0.34,
    s: 1.4 + rng() * 1.8,
    w: 6.283 / (70 + rng() * 90), ph: rng() * 6.283,
    w2: 6.283 / (90 + rng() * 110), ph2: rng() * 6.283
  });
}

/* ---------------- pools (fixed size, zero per-frame allocation) ---------------- */
var BOLTS = [], boltIdx = 0;
for (var bi = 0; bi < 48; bi++) {
  BOLTS.push({ active: false, delay: 0, age: 0, ttl: 1, x: 0, y: 0, sx: 0, sy: 0, vx: 0, vy: 0, fac: "order", tcap: -1, heavy: false });
}
var BOOMS = [], boomIdx = 0;
for (var xi = 0; xi < 12; xi++) {
  BOOMS.push({ active: false, x: 0, y: 0, r: 10, dur: 3, age: 0, glow: "warm" });
}
var SHIMS = [], shimIdx = 0;
for (var si = 0; si < 10; si++) {
  SHIMS.push({ active: false, cap: 0, age: 0, dur: 1, idx: 0 });
}
var SPARKS = [], sparkIdx = 0;
for (var ski = 0; ski < 36; ski++) {
  SPARKS.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, age: 0, ttl: 1 });
}

function spawnBolt(sx, sy, tx, ty, fk, tcap, delay, heavy) {
  var b = BOLTS[boltIdx]; boltIdx = (boltIdx + 1) % BOLTS.length;
  var dx = tx - sx, dy = ty - sy, d = Math.sqrt(dx * dx + dy * dy) || 1;
  var sp = minDim * (heavy ? 0.20 : 0.38);   // slow enough that a bolt's moving
                                             // highlight visibly rakes along a hull
  b.active = true; b.delay = delay || 0; b.age = 0; b.ttl = d / sp;
  b.x = sx; b.y = sy; b.sx = sx; b.sy = sy;
  b.vx = dx / d * sp; b.vy = dy / d * sp;
  b.fac = fk; b.tcap = (tcap === undefined ? -1 : tcap);
  b.heavy = !!heavy;
}
function spawnSparks(x, y, n) {
  for (var i = 0; i < n; i++) {
    var s = SPARKS[sparkIdx]; sparkIdx = (sparkIdx + 1) % SPARKS.length;
    var a = rng() * 6.283, sp = minDim * (0.04 + rng() * 0.14);
    s.active = true; s.x = x; s.y = y;
    s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp;
    s.age = 0; s.ttl = 0.4 + rng() * 0.5;
  }
}
function spawnBoom(x, y, r, dur, glow) {
  var e = BOOMS[boomIdx]; boomIdx = (boomIdx + 1) % BOOMS.length;
  e.active = true; e.x = x; e.y = y; e.r = r; e.dur = dur; e.age = 0; e.glow = glow;
}
function spawnShim(capIdx, dur, wx, wy) {
  var s = SHIMS[shimIdx]; shimIdx = (shimIdx + 1) % SHIMS.length;
  var c = caps[capIdx], o = c.outline;
  var best = 0;
  if (o) {   // nearest silhouette sample to the impact, in ship-local coords
    var dx = wx - c.x, dy = wy - c.y;
    var ca = Math.cos(c.ang), sa = Math.sin(c.ang);
    var lx = dx * ca + dy * sa, ly = -dx * sa + dy * ca;
    var bd = 1e18;
    for (var i = 0; i < o.length; i += 2) {
      var ox = o[i] - lx, oy = o[i + 1] - ly, d2 = ox * ox + oy * oy;
      if (d2 < bd) { bd = d2; best = i >> 1; }
    }
  }
  s.active = true; s.cap = capIdx; s.age = 0; s.dur = dur; s.idx = best;
}

/* ---------------- canvas & layout ---------------- */
var cv = document.getElementById("c");
var ctx = cv.getContext("2d");
var starCnv = document.createElement("canvas");
var W = 2, H = 2, minDim = 2, dpr = 1;
var ANCH = { order: [0, 0], entropy: [0, 0] };
var roam = { x: 0, y: 0, w: 1, h: 1 };
var FIRE_R2 = 1, REACH2 = 1;
var INITED = false;

function nebBlob(g, x, y, r, hue, a) {
  var gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, "hsla(" + hue + ",45%,38%," + a.toFixed(3) + ")");
  gr.addColorStop(1, "hsla(" + hue + ",45%,38%,0)");
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
}

function buildStarfield() {
  var sr = mulberry32(SEED ^ 0x5f3759df);   // stable across resizes
  starCnv.width = Math.ceil(W * dpr);
  starCnv.height = Math.ceil(H * dpr);
  var g = starCnv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  var bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0a0f1b");
  bg.addColorStop(0.6, "#070a13");
  bg.addColorStop(1, "#05070e");
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);
  // nebula wash: faction-tinted near each fleet, a brighter core behind the
  // engagement for contrast, neutral bands filling the whole frame
  var ecx = (ANCH.order[0] + ANCH.entropy[0]) / 2;   // engagement midpoint:
  var ecy = (ANCH.order[1] + ANCH.entropy[1]) / 2;   // the frame's focal point
  nebBlob(g, ANCH.order[0], ANCH.order[1] - H * 0.08, minDim * 0.6, FAC.order.hue, 0.08 * (0.5 + 0.5 * FAC.order.strength));
  nebBlob(g, ANCH.entropy[0], ANCH.entropy[1] - H * 0.05, minDim * 0.55, FAC.entropy.hue, 0.08 * (0.5 + 0.5 * FAC.entropy.strength));
  nebBlob(g, ecx, ecy, minDim * 1.0, 228, 0.06);
  // the lower-left corner is depth, not emptiness: a cool nebula shoulder
  // sits behind the far fleet and debris field that drift there
  nebBlob(g, W * 0.16, H * 0.82, minDim * 0.9, 225, 0.05);
  nebBlob(g, W * 0.82, H * 0.18, minDim * 0.7, 232, 0.04);
  // distant planet: a limb arc rising out of the lower-right corner —
  // something the battle happens NEAR, never the subject of the frame.
  // Lit by the screen-top key (biased a little right so the terminator falls
  // inside the frame): bright limb upper-right, sinking to near-black toward
  // the lower-left, with low-contrast banding so it reads as a world.
  var R = Math.max(W, H) * 1.1;
  var pcx = W * 1.02, pcy = H + R * 0.80;
  var LX = 0.62, LY = -0.785;                 // unit vector toward the key light
  var plx = pcx + LX * R, ply = pcy + LY * R; // lit point on the limb (offscreen right)
  g.save();
  g.beginPath();
  g.arc(pcx, pcy, R, 0, 6.283);
  g.clip();
  // base crust
  g.fillStyle = "hsl(219,25%,19%)";
  g.fillRect(0, 0, W, H);
  // large-scale banding, concentric with the limb, quiet contrast
  g.lineCap = "round";
  for (var pb = 0; pb < 8; pb++) {
    var brad = R * (0.70 + 0.33 * sr());
    g.lineWidth = R * (0.018 + 0.05 * sr());
    g.strokeStyle = "hsla(" + Math.round(208 + sr() * 26) + ",24%," +
      Math.round(12 + sr() * 24) + "%," + (0.14 + sr() * 0.12).toFixed(3) + ")";
    g.beginPath();
    g.arc(pcx, pcy, brad, -2.7, -1.2);
    g.stroke();
  }
  // continental / cloud mottling breaking up the bands
  for (var pm = 0; pm < 10; pm++) {
    var mth = -2.55 + sr() * 1.25, mrr = R * (0.80 + 0.19 * sr());
    var mx = pcx + Math.cos(mth) * mrr, my = pcy + Math.sin(mth) * mrr;
    var mr = R * (0.03 + 0.09 * sr());
    var mg = g.createRadialGradient(mx, my, 0, mx, my, mr);
    var ml = sr() < 0.5;   // half lighter patches, half darker
    mg.addColorStop(0, ml ? "hsla(215,18%,36%," + (0.08 + sr() * 0.08).toFixed(3) + ")"
                          : "hsla(226,24%,7%," + (0.10 + sr() * 0.09).toFixed(3) + ")");
    mg.addColorStop(1, "hsla(220,20%,20%,0)");
    g.fillStyle = mg;
    g.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
  }
  // terminator: shade away from the lit limb point into near-black
  var tg = g.createRadialGradient(plx, ply, 0, plx, ply, R * 2);
  tg.addColorStop(0, "rgba(2,3,8,0)");
  tg.addColorStop(0.32, "rgba(2,3,8,0.06)");
  tg.addColorStop(0.48, "rgba(2,3,8,0.45)");
  tg.addColorStop(0.64, "rgba(2,3,8,0.84)");
  tg.addColorStop(1, "rgba(2,3,8,0.95)");
  g.fillStyle = tg;
  g.fillRect(0, 0, W, H);
  // cool daylight wash on the lit side
  g.globalCompositeOperation = "lighter";
  var lw = g.createRadialGradient(plx, ply, 0, plx, ply, R * 1.5);
  lw.addColorStop(0, "hsla(214,48%,60%,0.32)");
  lw.addColorStop(0.5, "hsla(216,42%,52%,0.11)");
  lw.addColorStop(1, "hsla(216,40%,50%,0)");
  g.fillStyle = lw;
  g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "source-over";
  g.restore();
  // limb pass, per segment: atmospheric rim light scaled by how much the key
  // grazes that point, and a dark feather so the night-side edge stays soft
  g.lineCap = "round";
  var SEG = 64, th0 = -2.55, th1 = -1.35, dth = (th1 - th0) / SEG;
  for (var ps = 0; ps <= SEG; ps++) {
    var th = th0 + dth * ps;
    var lit = Math.cos(th) * LX - Math.sin(th) * (-LY);
    lit = lit > 0 ? lit * lit : 0;    // squared: tight bright arc near grazing
    var a0 = th - dth * 0.62, a1 = th + dth * 0.62;
    if (lit > 0.004) {
      g.strokeStyle = "hsla(205,88%,78%," + Math.min(1, lit * 1.4).toFixed(3) + ")";
      g.lineWidth = 2.2;
      g.beginPath(); g.arc(pcx, pcy, R - 0.4, a0, a1); g.stroke();
      g.strokeStyle = "hsla(206,75%,64%," + (lit * 0.42).toFixed(3) + ")";
      g.lineWidth = 7;
      g.beginPath(); g.arc(pcx, pcy, R + 1.5, a0, a1); g.stroke();
      g.strokeStyle = "hsla(207,68%,58%," + (lit * 0.16).toFixed(3) + ")";
      g.lineWidth = 18;
      g.beginPath(); g.arc(pcx, pcy, R + 5.5, a0, a1); g.stroke();
      g.strokeStyle = "hsla(208,60%,55%," + (lit * 0.07).toFixed(3) + ")";
      g.lineWidth = 38;
      g.beginPath(); g.arc(pcx, pcy, R + 14, a0, a1); g.stroke();
    }
    var dk = (1 - Math.min(1, lit * 3)) * 0.45;
    if (dk > 0.01) {                  // feather the unlit silhouette into the sky
      g.strokeStyle = "hsla(222,30%,4%," + dk.toFixed(3) + ")";
      g.lineWidth = 6;
      g.beginPath(); g.arc(pcx, pcy, R, a0, a1); g.stroke();
    }
  }
  g.lineCap = "butt";
  var R2 = R * R;
  // stars (none inside the planet disc)
  var n = Math.min(900, Math.round(W * H / 3500));
  for (var i = 0; i < n; i++) {
    var x = sr() * W, y = sr() * H;
    var r = 0.3 + sr() * sr() * 1.0;
    var al = (0.16 + sr() * 0.66) * STAR_BRIGHT;
    var t = sr();
    if ((x - pcx) * (x - pcx) + (y - pcy) * (y - pcy) < R2) continue;
    g.fillStyle = t < 0.12 ? "#ffe9d0" : (t < 0.3 ? "#cfe0ff" : "#dfe8f5");
    g.globalAlpha = al;
    g.fillRect(x, y, r * 2, r * 2);
  }
  // a few bright foreground stars with faint cross flares
  for (var b2 = 0; b2 < 6; b2++) {
    var bx = sr() * W, by = sr() * H * 0.7, br = 1.1 + sr() * 0.9;
    g.globalAlpha = 0.85 * STAR_BRIGHT;
    g.fillStyle = "#eef4ff";
    g.beginPath();
    g.arc(bx, by, br, 0, 6.283);
    g.fill();
    g.globalAlpha = 0.14 * STAR_BRIGHT;
    g.strokeStyle = "#dfe8f5";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(bx - br * 5, by); g.lineTo(bx + br * 5, by);
    g.moveTo(bx, by - br * 5); g.lineTo(bx, by + br * 5);
    g.stroke();
  }
  g.globalAlpha = 1;
  // soft haze from the screen-top key light, motivating every rim light
  var kg = g.createLinearGradient(0, 0, 0, H * 0.3);
  kg.addColorStop(0, "rgba(190,210,240,0.05)");
  kg.addColorStop(1, "rgba(190,210,240,0)");
  g.fillStyle = kg;
  g.fillRect(0, 0, W, H * 0.3);
  // cinematic vignette: pulls the eye to the engagement, deepens the corners
  var vg = g.createRadialGradient(ecx, ecy, minDim * 0.45, ecx, ecy, Math.max(W, H) * 0.75);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.38)");
  g.fillStyle = vg;
  g.fillRect(0, 0, W, H);
}

/* ---- capital ship sprite: per-faction hull language (Order = slab-sided
        hammerhead, Entropy = angular needle), axis-symmetric mass with a
        defined prow, inset dorsal/ventral tier stacks, stern engine cluster,
        RCS ports, rim light, greebles, window rows — baked once per resize ---- */
function buildShipSprite(cap) {
  var sr = mulberry32(cap.seed);
  var blocky = cap.fac === "order";
  var L = cap.len, HH = L * (blocky ? 0.30 : 0.21);
  var pad = Math.ceil(L * 0.10) + 8;
  var cw = Math.ceil(L) + pad * 2, ch = Math.ceil(HH * 3.4) + pad * 2;
  var cnv = document.createElement("canvas");
  cnv.width = cw; cnv.height = ch;
  var g = cnv.getContext("2d");
  var hue = FAC[cap.fac].hue;
  // generating geometry recorded for the analytic normal-map bake (GL path)
  cap.geoTiers = []; cap.geoBells = []; cap.geoEms = []; cap.geoBays = []; cap.geoRibs = [];
  // key light comes from screen-top for every ship; pick which local edge that is
  var up = Math.cos(cap.baseAng) >= 0 ? -1 : 1;
  g.translate(pad, ch / 2);          // hull local: x in [0,L] (nose at +x), y about 0
  function j(a) { return (sr() - 0.5) * a; }
  function hsl(s, l, a) {
    return a === undefined ? "hsl(" + hue + "," + s + "%," + l + "%)"
                           : "hsla(" + hue + "," + s + "%," + l + "%," + a + ")";
  }
  // hull half-height profile (×HH) at stations u = x/L, prow at u=1.
  // dorsal and ventral are near-mirrors (tiny independent jitter only), so
  // there is no waterline reading — the mass is symmetric about its long axis.
  var base = blocky
    ? [[0, 0.50], [0.05, 0.56], [0.10, 0.42], [0.38, 0.46], [0.62, 0.40],
       [0.80, 0.30], [0.84, 0.52], [0.97, 0.49], [1, 0.30]]   // hammerhead, flat bow face
    : [[0, 0.42], [0.05, 0.50], [0.11, 0.34], [0.28, 0.40], [0.52, 0.30],
       [0.74, 0.21], [0.90, 0.12], [1, 0.02]];                // needle taper to a point
  function jitterCtl() {
    var out = [];
    for (var ji = 0; ji < base.length; ji++) {
      out.push([base[ji][0],
        base[ji][1] + (ji > 0 && ji < base.length - 1 ? j(0.05) : 0)]);
    }
    return out;
  }
  var dC = jitterCtl(), vC = jitterCtl();
  function prof(ctl, u) {
    for (var i = 1; i < ctl.length; i++) {
      if (u <= ctl[i][0]) {
        var a = ctl[i - 1], b = ctl[i];
        return a[1] + (b[1] - a[1]) * ((u - a[0]) / ((b[0] - a[0]) || 1));
      }
    }
    return ctl[ctl.length - 1][1];
  }
  var NS = 26, sx = [], sd = [], sv = [];
  for (var st = 0; st <= NS; st++) {
    var u = st / NS;
    sx.push(u * L); sd.push(-HH * prof(dC, u)); sv.push(HH * prof(vC, u));
  }
  // main hull, lit from the screen-up side. The GL bake keeps the gradient
  // nearly flat so the dynamic key light + point lights sculpt the hull;
  // the 2D fallback keeps the strong baked shading.
  var hgrad = g.createLinearGradient(0, up * HH * 0.7, 0, -up * HH * 0.7);
  hgrad.addColorStop(0, hsl(11, GLR ? 17 : 21));
  hgrad.addColorStop(0.45, hsl(10, GLR ? 14 : 13));
  hgrad.addColorStop(1, hsl(12, GLR ? 11 : 7));
  g.fillStyle = hgrad;
  g.beginPath();
  g.moveTo(sx[NS], sd[NS]);
  for (var h1 = NS - 1; h1 >= 0; h1--) g.lineTo(sx[h1], sd[h1]);
  for (var h2 = 0; h2 <= NS; h2++) g.lineTo(sx[h2], sv[h2]);
  g.closePath();
  g.fill();
  function dY(u) { return -HH * prof(dC, u); }
  function vY(u) { return HH * prof(vC, u); }
  // the prow announces a front
  if (blocky) {
    // hammerhead cheek plates and a lit armoured bow face
    g.fillStyle = hsl(10, 10);
    g.beginPath();
    g.moveTo(L * 0.84, dY(0.84)); g.lineTo(L, dY(1)); g.lineTo(L, dY(1) + HH * 0.16);
    g.lineTo(L * 0.86, dY(0.86) + HH * 0.14); g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(L * 0.84, vY(0.84)); g.lineTo(L, vY(1)); g.lineTo(L, vY(1) - HH * 0.16);
    g.lineTo(L * 0.86, vY(0.86) - HH * 0.14); g.closePath(); g.fill();
    g.strokeStyle = "rgba(220,234,252,0.5)";
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(L, dY(1)); g.lineTo(L, vY(1)); g.stroke();
  } else {
    // needle leading edges converge on the point
    g.strokeStyle = hsl(30, 45, 0.45);
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(L * 0.52, dY(0.52)); g.lineTo(L, 0); g.lineTo(L * 0.52, vY(0.52));
    g.stroke();
  }
  // stepped tier assemblies set INTO the hull: a dorsal stack plus a smaller
  // ventral stack at a different station — never a lone conning tower
  cap.lights.length = 0;
  function tierStack(side, u0, wFrac, nT) {
    var x0 = L * u0, w0 = L * wFrac;
    var um = (x0 + w0 / 2) / L;
    var ty = (side < 0 ? dY(um) : vY(um)) * 0.78;   // base sits inside the mass
    for (var tr = 0; tr < nT; tr++) {
      var tw2 = w0 * (1 - tr * 0.28), th2 = HH * (0.13 + sr() * 0.05);
      var tx2 = x0 + (w0 - tw2) * (0.25 + sr() * 0.5);
      g.fillStyle = hsl(9, 15 - tr * 2);
      var tty;   // this tier rect's top edge
      if (side < 0) { g.fillRect(tx2, ty - th2, tw2, th2 + 1); ty -= th2; tty = ty; }
      else          { g.fillRect(tx2, ty - 1, tw2, th2 + 1); tty = ty - 1; ty += th2; }
      // one end of every tier is a sloped face — no all-square-on box
      var slp = sr() < 0.5 ? 1 : -1;
      cap.geoTiers.push({ x: tx2, y: tty, w: tw2, h: th2 + 1, side: side, sl: slp });
      var sw3 = tw2 * 0.3;
      g.fillStyle = "rgba(0,0,0,0.18)";
      g.fillRect(slp > 0 ? tx2 + tw2 - sw3 : tx2, tty, sw3, th2 + 1);
      // recessed window bays / vents bite into the face and the normal map,
      // so a nearby light shows structure and shadowed recesses, not a wash
      g.fillStyle = "rgba(0,0,0,0.32)";
      var bayH = Math.max(2, th2 * 0.5), bayY = tty + (th2 + 1 - bayH) / 2;
      for (var bx = tx2 + 2.5; bx < tx2 + tw2 - 4; bx += 5) {
        if (sr() < 0.55) {
          g.fillRect(bx, bayY, 2, bayH);
          cap.geoBays.push({ x: bx, y: bayY, w: 2, h: bayH });
        }
      }
      // a raised rib along the outer edge catches the light
      var ribY = side < 0 ? tty + 1 : tty + th2 - 1;
      g.fillStyle = "rgba(255,255,255,0.07)";
      g.fillRect(tx2 + 1, ribY, tw2 - 2, 1);
      cap.geoRibs.push({ x: tx2 + 1, y: ribY, w: tw2 - 2, h: 1, side: side });
      g.fillStyle = "rgba(210,224,240,0.75)";
      for (var wv = tx2 + 2; wv < tx2 + tw2 - 2; wv += 4) {
        if (sr() < 0.6) {
          g.fillRect(wv, side < 0 ? ty + 2 : ty - 3, 1, 1);
          cap.geoEms.push({ x: wv, y: side < 0 ? ty + 2 : ty - 3, w: 1, h: 1, e: 0.6 });
        }
      }
    }
    return { x0: x0, w0: w0, ty: ty };
  }
  var uD = (blocky ? 0.30 : 0.22) + sr() * 0.10;
  var dTop = tierStack(-1, uD, blocky ? 0.16 : 0.13, 2 + Math.floor(sr() * 2));
  tierStack(1, uD + 0.18 + sr() * 0.10, 0.10, 1 + Math.floor(sr() * 2));
  // antenna masts off the dorsal stack
  g.strokeStyle = hsl(8, 26, 0.8);
  g.lineWidth = 1;
  var nm = 1 + Math.floor(sr() * 2);
  for (var am = 0; am < nm; am++) {
    var ax2 = dTop.x0 + sr() * dTop.w0, ah2 = HH * (0.2 + sr() * 0.25);
    g.beginPath(); g.moveTo(ax2, dTop.ty); g.lineTo(ax2, dTop.ty - ah2); g.stroke();
    if (am === 0) cap.lights.push({ x: ax2 - L / 2, y: dTop.ty - ah2, per: 1.6 + sr() * 3, ph: sr() });
  }
  // manoeuvring thruster ports fore and aft, dorsal + ventral (fired live during yaw)
  cap.rcs.length = 0;
  for (var rc = 0; rc < 2; rc++) {
    var ru = (rc ? 0.80 : 0.14) + j(0.04);
    cap.rcs.push(L * ru - L / 2, dY(ru) + 1, -1);
    cap.rcs.push(L * ru - L / 2, vY(ru) - 1, 1);
    g.fillStyle = hsl(10, 20);
    g.fillRect(L * ru - 1.5, dY(ru) - 1, 3, 2);
    g.fillRect(L * ru - 1.5, vY(ru) - 1, 3, 2);
  }
  // panel seams at a fixed ~15–21 px pitch, so larger hulls subdivide more
  g.strokeStyle = "rgba(0,0,0,0.3)";
  g.lineWidth = 1;
  var pitch = 15 + sr() * 6;
  for (var px2 = L * 0.10; px2 < L * 0.96; px2 += pitch) {
    var uu = px2 / L;
    g.beginPath();
    g.moveTo(px2, -HH * prof(dC, uu) + 1);
    g.lineTo(px2 + j(3), HH * prof(vC, uu) - 1);
    g.stroke();
  }
  // subtle plating tone patches (no long lateral seam — that read as a waterline)
  for (var pp = 0; pp < Math.round(L / 26); pp++) {
    g.fillStyle = sr() < 0.5 ? "rgba(255,255,255,0.03)" : "rgba(0,0,0,0.08)";
    g.fillRect(L * (0.08 + sr() * 0.8), (sr() - 0.5) * HH * 0.6, 6 + sr() * pitch, 2 + sr() * 5);
  }
  // sensor blisters on the hull edges
  g.fillStyle = hsl(12, 18);
  for (var sb = 0; sb < 3; sb++) {
    var sbx = L * (0.2 + sr() * 0.6);
    var sby = (sr() < 0.5 ? -1 : 1) * HH * prof(sr() < 0.5 ? dC : vC, sbx / L) * 0.85;
    g.beginPath(); g.arc(sbx, sby, 1.5 + sr() * 2, 0, 6.283); g.fill();
  }
  // window rows at a fixed ~5 px spacing along the whole hull (the scale cue);
  // activity closes/open gaps between banks, integrity (+ metrics) sets lit fraction
  var litFrac = clamp(0.30 + 0.55 * cap.integ + LIT_BONUS[cap.fac], 0, 1);
  var gapFrac = clamp(0.42 - 0.28 * cap.act, 0.1, 0.5);
  var rows = L > 230 ? 3 : 2;
  for (var rw = 0; rw < rows; rw++) {
    var ry = (rw - (rows - 1) / 2) * HH * 0.30 + j(HH * 0.05);
    for (var wx2 = L * 0.08; wx2 < L * 0.95; wx2 += 5) {
      var sIdx = Math.round(wx2 / L * NS);
      var lim = Math.min(-sd[sIdx], sv[sIdx]);
      if (Math.abs(ry) > lim * 0.8) continue;
      if (sr() < gapFrac) continue;
      if (sr() < litFrac) {
        g.fillStyle = sr() < 0.85 ? "rgba(215,228,242,0.85)" : hsl(80, 70);
        g.globalAlpha = 0.55 + sr() * 0.45;
        cap.geoEms.push({ x: wx2, y: ry, w: 2, h: 1, e: 0.35 + 0.5 * g.globalAlpha });
      } else {
        g.fillStyle = "rgba(90,100,115,0.35)";
        g.globalAlpha = 0.6;
      }
      g.fillRect(wx2, ry, 1.4, 1);
    }
  }
  g.globalAlpha = 1;
  // stern engine cluster: blocky hulls pack more, smaller bells; needles mount
  // fewer, larger ones (plume drawn live)
  var ne = blocky ? 3 + Math.floor(sr() * 2) : 2 + Math.floor(sr() * 2);
  cap.eng.length = 0;
  var rb = Math.min(HH * 0.18, HH * 0.9 / ((ne - 1) * 2.3 + 2));
  for (var e = 0; e < ne; e++) {
    var ey = (e - (ne - 1) / 2) * rb * 2.3;
    g.fillStyle = hsl(8, 10);
    g.beginPath(); g.arc(-rb * 0.4, ey, rb, 0, 6.283); g.fill();
    var cg = g.createRadialGradient(-rb * 0.5, ey, 0, -rb * 0.5, ey, rb * 0.8);
    cg.addColorStop(0, "hsla(" + hue + ",85%,85%,0.95)");
    cg.addColorStop(0.5, "hsla(" + hue + ",80%,60%,0.5)");
    cg.addColorStop(1, "hsla(" + hue + ",80%,55%,0)");
    g.fillStyle = cg;
    g.beginPath(); g.arc(-rb * 0.5, ey, rb * 0.8, 0, 6.283); g.fill();
    cap.eng.push(-L / 2 - rb * 0.5, ey);
    cap.geoBells.push({ x: -rb * 0.4, y: ey, r: rb });
  }
  // painted fleet glyph blocks near the bow, derived from the label (never text)
  var gr = mulberry32(strSeed(cap.label || "hull"));
  g.globalAlpha = 0.5;
  g.fillStyle = hsl(60, 55);
  var gx = L * (blocky ? 0.68 : 0.52), nGly = 2 + Math.floor(gr() * 3);
  for (var gy2 = 0; gy2 < nGly; gy2++) {
    var gw2 = 2 + gr() * 4;
    g.fillRect(gx, -1.5, gw2, 3);
    gx += gw2 + 2 + gr() * 3;
  }
  g.globalAlpha = 1;
  // hard rim light along the key-lit (screen-up) edge: soft pass + hard pass
  var rimD = up < 0;
  for (var rp = 0; rp < 2; rp++) {
    g.strokeStyle = rp ? "rgba(225,238,255,0.75)" : "rgba(205,222,245,0.2)";
    g.lineWidth = rp ? 1 : 2.5;
    g.beginPath();
    g.moveTo(sx[1], rimD ? sd[1] : sv[1]);
    for (var r1 = 2; r1 <= NS; r1++) g.lineTo(sx[r1], rimD ? sd[r1] : sv[r1]);
    g.stroke();
  }
  if (rimD) {   // the dorsal tier stack catches the key light too
    g.strokeStyle = "rgba(215,230,250,0.5)";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(dTop.x0, dTop.ty);
    g.lineTo(dTop.x0 + dTop.w0 * 0.72, dTop.ty);
    g.stroke();
  }
  // nav lights at the extremities
  cap.lights.push({ x: L / 2 - 2, y: 0, per: 2.2 + sr() * 2, ph: sr() });
  cap.lights.push({ x: -L / 2 + 2, y: sd[0] + 1, per: 1.8 + sr() * 2.5, ph: sr() });
  cap.lights.push({ x: -L / 2 + 2, y: sv[0] - 1, per: 2.6 + sr() * 2, ph: sr() });
  // silhouette samples in centered coords, for hull-conforming shield arcs
  cap.outline = new Float32Array((NS + 1) * 4);
  var oi = 0;
  for (var o1 = NS; o1 >= 0; o1--) { cap.outline[oi++] = sx[o1] - L / 2; cap.outline[oi++] = sd[o1]; }
  for (var o2 = 0; o2 <= NS; o2++) { cap.outline[oi++] = sx[o2] - L / 2; cap.outline[oi++] = sv[o2]; }
  // damage embers (positions only; flicker drawn live)
  var nEmber = Math.round((1 - cap.integ) * 7);
  cap.embers.length = 0;
  for (var m = 0; m < nEmber; m++) {
    cap.embers.push(L * (0.1 + sr() * 0.8) - L / 2, (sr() - 0.5) * HH * 0.5, sr() * 6.283);
  }
  // normal map re-derived from THIS hull's generating geometry: the jittered
  // per-faction profile stations (sd/sv) drive the cross-section sweep; tier
  // rects, bells and emissive windows were recorded above as they were drawn
  cap.nrm = null;
  if (GLR) {
    var profAt = function (arr) {
      return function (lx) {
        var u = clamp(lx / L, 0, 1) * NS;
        var i0 = Math.floor(u), i1 = Math.min(NS, i0 + 1);
        return arr[i0] + (arr[i1] - arr[i0]) * (u - i0);
      };
    };
    cap.nrm = bakeNormals(cw, ch, pad, ch / 2, L, profAt(sd), profAt(sv),
      { tiers: cap.geoTiers, bells: cap.geoBells, ems: cap.geoEms,
        bays: cap.geoBays, ribs: cap.geoRibs, prow: blocky ? 3 : 0 });
  }
  cap.sprite = cnv; cap.sw = cw; cap.sh = ch;
}

function layoutCapitals() {
  var land = W >= H;
  // composition: the two fleets sit on a lower-left -> upper-right diagonal
  // that runs through the centre of the frame, so the engagement midpoint IS
  // the focal point. Order holds the nearer, lower station; the dim far
  // fleet and debris field carry the lower-left corner behind it.
  if (land) {
    ANCH.order[0] = W * 0.36; ANCH.order[1] = H * 0.60;
    ANCH.entropy[0] = W * 0.68; ANCH.entropy[1] = H * 0.30;
    roam.x = W * 0.05; roam.y = H * 0.06; roam.w = W * 0.90; roam.h = H * 0.80;
  } else {
    ANCH.order[0] = W * 0.42; ANCH.order[1] = H * 0.56;
    ANCH.entropy[0] = W * 0.64; ANCH.entropy[1] = H * 0.27;
    roam.x = W * 0.08; roam.y = H * 0.06; roam.w = W * 0.84; roam.h = H * 0.78;
  }
  var sides = ["order", "entropy"];
  for (var s = 0; s < 2; s++) {
    var fk = sides[s], other = sides[1 - s];
    var ax = ANCH[fk][0], ay = ANCH[fk][1];
    var dir = Math.atan2(ANCH[other][1] - ay, ANCH[other][0] - ax);
    var pxd = -Math.sin(dir), pyd = Math.cos(dir);
    var idxs = CAPF[fk];
    for (var i = 0; i < idxs.length; i++) {
      var cap = caps[idxs[i]];
      var off = (i - (idxs.length - 1) / 2) * 0.19 * minDim + cap.jPerp * minDim;
      var along = cap.jAlong * minDim;
      cap.ax = ax + pxd * off + Math.cos(dir) * along;
      cap.ay = ay + pyd * off + Math.sin(dir) * along;
      cap.baseAng = dir + cap.angDev;
      // the capitals carry the whole sense of scale: big enough that the
      // fixed-pitch window rows resolve and fighters read as motes beside them
      cap.len = minDim * (0.155 + 0.215 * cap.size);
      cap.x = cap.ax; cap.y = cap.ay; cap.ang = cap.baseAng;
      buildShipSprite(cap);
    }
  }
}

function pickRoam(f) {
  var px = roam.x + rng() * roam.w, py = roam.y + rng() * roam.h;
  f.wx = px * 0.65 + ANCH[f.fac][0] * 0.35;
  f.wy = py * 0.65 + ANCH[f.fac][1] * 0.35;
  f.mode = 0; f.tgt = -1;
}
function pickWaypoint(f) {
  if (rng() < clamp(0.18 + 0.45 * f.agg * BUSY, 0, 0.8)) {
    var enemy = f.fac === "order" ? "entropy" : "order";
    var tIdx = randCapIdx(enemy), c = caps[tIdx];
    f.wx = c.x + (rng() - 0.5) * c.len * 2.2;
    f.wy = c.y + (rng() - 0.5) * c.len * 1.2;
    f.mode = 1; f.tgt = tIdx;
  } else {
    pickRoam(f);
  }
}
function respawnFighter(f, cap) {
  f.x = cap.x; f.y = cap.y;
  f.front = rng() < 0.6;
  f.vx = Math.cos(cap.ang) * f.spd * 0.5;
  f.vy = Math.sin(cap.ang) * f.spd * 0.5;
  f.fadeIn = 0;
  f.timer = 30 + f.life * 150;
  for (var k = 0; k < TRAIL; k++) { f.trail[k * 2] = f.x; f.trail[k * 2 + 1] = f.y; }
  pickWaypoint(f);
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  W = Math.max(2, window.innerWidth);
  H = Math.max(2, window.innerHeight);
  cv.width = Math.ceil(W * dpr);
  cv.height = Math.ceil(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  minDim = Math.min(W, H);
  FIRE_R2 = Math.pow(minDim * 0.35, 2);
  REACH2 = Math.pow(minDim * 0.03 + 8, 2);
  layoutCapitals();
  buildStarfield();
  if (GLR) glResize();
  for (var i = 0; i < ftrs.length; i++) {
    var f = ftrs[i];
    f.spd = minDim * (0.06 + 0.11 * f.spd01);
    if (!INITED) {
      var c = caps[randCapIdx(f.fac)];
      f.x = c.x + (rng() - 0.5) * minDim * 0.2;
      f.y = c.y + (rng() - 0.5) * minDim * 0.15;
      for (var k = 0; k < TRAIL; k++) { f.trail[k * 2] = f.x; f.trail[k * 2 + 1] = f.y; }
      pickWaypoint(f);
    }
  }
  INITED = true;
}

/* ---------------- events ---------------- */
function fireEvent(e) {
  var enemy = e.fac === "order" ? "entropy" : "order";
  if (e.kind === "strike") {
    // heavy main-gun volley: few fat shells, really spaced in time, on
    // parallel-but-offset paths so they never read as a dashed line
    var src = caps[randCapIdx(e.fac)];
    var tIdx = randCapIdx(enemy), tgt = caps[tIdx];
    var n = 1 + Math.round(e.mag * 2);
    var bdx = tgt.x - src.x, bdy = tgt.y - src.y;
    var bd = Math.sqrt(bdx * bdx + bdy * bdy) || 1;
    var pxn = -bdy / bd, pyn = bdx / bd;
    for (var i = 0; i < n; i++) {
      var off = (i - (n - 1) / 2) * src.len * 0.22 + (rng() - 0.5) * src.len * 0.08;
      spawnBolt(
        src.x + Math.cos(src.ang) * src.len * 0.45 + pxn * off,
        src.y + Math.sin(src.ang) * src.len * 0.45 + pyn * off,
        tgt.x + pxn * off * 0.6 + (rng() - 0.5) * tgt.len * 0.3,
        tgt.y + pyn * off * 0.6 + (rng() - 0.5) * tgt.len * 0.15,
        e.fac, tIdx, i * (0.55 + rng() * 0.35), true);
    }
  } else if (e.kind === "loss") {
    var cIdx = randCapIdx(e.fac), c = caps[cIdx];
    var lbx = c.x + (rng() - 0.5) * c.len * 0.6;
    var lby = c.y + (rng() - 0.5) * c.len * 0.25;
    spawnBoom(lbx, lby, minDim * (0.02 + 0.09 * e.mag), 2.5 + 3.5 * e.mag, "warm");
    spawnSparks(lbx, lby, 6 + Math.round(e.mag * 5));
    spawnShim(cIdx, 0.5, lbx, lby);
  } else { // launch
    var lIdx = randCapIdx(e.fac), lc = caps[lIdx];
    spawnBoom(lc.x, lc.y, minDim * 0.012, 1.0, e.fac);   // launch flash keeps faction hue (it's the carrier, not a shot)
    var want = 1 + Math.round(e.mag * 3), got = 0;
    for (var k = 0; k < ftrs.length && got < want; k++) {
      if (ftrs[k].fac === e.fac) { respawnFighter(ftrs[k], lc); got++; }
    }
  }
}

/* ---------------- simulation ---------------- */
var LOOP = 150;                 // seconds per event loop
var prevLoopT = 0, evIdx = 0;
var nextAmb = 25 + rng() * 50;  // ambient distant explosions

function update(dt, tSec) {
  var loopT = (tSec % LOOP) / LOOP;
  if (loopT < prevLoopT) evIdx = 0;
  while (evIdx < EV.length && EV[evIdx].t <= loopT) { fireEvent(EV[evIdx]); evIdx++; }
  prevLoopT = loopT;

  if (tSec >= nextAmb) {
    nextAmb = tSec + 35 + rng() * 70;
    spawnBoom(roam.x + rng() * roam.w, roam.y + rng() * roam.h * 0.8,
      minDim * (0.008 + rng() * 0.02), 2 + rng() * 3, "white");
  }

  // capitals: bounded periodic drift + slow yaw (safe for weeks of uptime)
  var ampA = minDim * 0.012, i, cap;
  for (i = 0; i < caps.length; i++) {
    cap = caps[i];
    cap.x = cap.ax + Math.sin(tSec * cap.wA + cap.dphA) * ampA;
    cap.y = cap.ay + Math.sin(tSec * cap.wB + cap.dphB) * ampA * 0.8;
    cap.ang = cap.baseAng + Math.sin(tSec * cap.wY + cap.dphY) * cap.yawAmp;
  }

  // fighters
  for (i = 0; i < ftrs.length; i++) {
    var f = ftrs[i];
    f.timer -= dt;
    if (f.timer <= 0) respawnFighter(f, caps[randCapIdx(f.fac)]);
    if (f.fadeIn < 1) f.fadeIn = Math.min(1, f.fadeIn + dt * 0.7);
    var dx = f.wx - f.x, dy = f.wy - f.y;
    var d2 = dx * dx + dy * dy;
    if (d2 < REACH2) {
      pickWaypoint(f);
      dx = f.wx - f.x; dy = f.wy - f.y; d2 = dx * dx + dy * dy;
    }
    var d = Math.sqrt(d2) || 1;
    var turn = Math.min(1, (1.1 + f.agg * 1.8) * dt);   // limited turn rate -> banking arcs
    f.vx += (dx / d * f.spd - f.vx) * turn;
    f.vy += (dy / d * f.spd - f.vy) * turn;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    if (f.x < roam.x || f.x > roam.x + roam.w || f.y < roam.y || f.y > roam.y + roam.h) pickRoam(f);
    f.trail[f.ti * 2] = f.x;
    f.trail[f.ti * 2 + 1] = f.y;
    f.ti = (f.ti + 1) % TRAIL;
    // strafing fire
    if (f.mode === 1 && f.tgt >= 0) {
      var c2 = caps[f.tgt];
      var ex = c2.x - f.x, ey = c2.y - f.y;
      if (ex * ex + ey * ey < FIRE_R2) {
        f.cd -= dt * BUSY;
        if (f.cd <= 0) {
          f.cd = 2.6 + (1 - f.agg) * 5;
          spawnBolt(f.x, f.y,
            c2.x + (rng() - 0.5) * c2.len * 0.4,
            c2.y + (rng() - 0.5) * c2.len * 0.2,
            f.fac, f.tgt, 0);
        }
      }
    }
  }

  // bolts
  for (i = 0; i < BOLTS.length; i++) {
    var b = BOLTS[i];
    if (!b.active) continue;
    if (b.delay > 0) { b.delay -= dt; continue; }
    b.age += dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.age >= b.ttl) {
      b.active = false;
      spawnBoom(b.x, b.y, minDim * (b.heavy ? 0.030 : 0.012), b.heavy ? 1.6 : 0.8, "red");
      spawnSparks(b.x, b.y, b.heavy ? 8 : 4);
      if (b.tcap >= 0) spawnShim(b.tcap, 0.35 + rng() * 0.15, b.x, b.y);
    }
  }
  // explosions, shimmers & debris sparks
  for (i = 0; i < BOOMS.length; i++) {
    if (BOOMS[i].active && (BOOMS[i].age += dt) >= BOOMS[i].dur) BOOMS[i].active = false;
  }
  for (i = 0; i < SHIMS.length; i++) {
    if (SHIMS[i].active && (SHIMS[i].age += dt) >= SHIMS[i].dur) SHIMS[i].active = false;
  }
  for (i = 0; i < SPARKS.length; i++) {
    var sk = SPARKS[i];
    if (!sk.active) continue;
    sk.age += dt;
    if (sk.age >= sk.ttl) { sk.active = false; continue; }
    sk.x += sk.vx * dt; sk.y += sk.vy * dt;
    sk.vx *= 1 - 2.2 * dt; sk.vy *= 1 - 2.2 * dt;
  }
}

/* ---------------- render ---------------- */
function drawFighters(front, tSec) {
  for (var i = 0; i < ftrs.length; i++) {
    var f = ftrs[i];
    if (f.front !== front) continue;
    var fa = Math.min(1, f.fadeIn) * Math.min(1, f.timer * 0.5);
    if (fa <= 0.02) continue;
    // tapered additive trail, oldest -> newest, in 6 width/alpha chunks
    ctx.strokeStyle = COL[f.fac].trail;
    var idx = f.ti, step = 0;
    var px = f.trail[idx * 2], py = f.trail[idx * 2 + 1];
    for (var c2 = 0; c2 < 6; c2++) {
      var tt = (c2 + 1) / 6;
      ctx.globalAlpha = 0.7 * fa * tt * tt;
      ctx.lineWidth = 0.5 + 1.6 * tt;
      ctx.beginPath();
      ctx.moveTo(px, py);
      for (var k = 0; k < 4 && step < TRAIL - 1; k++, step++) {
        idx = (idx + 1) % TRAIL;
        px = f.trail[idx * 2]; py = f.trail[idx * 2 + 1];
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    // engine glow just behind the nose, then the hot nose itself
    var back = 4 / (f.spd || 1);
    ctx.globalAlpha = 0.55 * fa;
    ctx.drawImage(FGLOW[f.fac], f.x - f.vx * back - 3.5, f.y - f.vy * back - 3.5, 7, 7);
    ctx.globalAlpha = 0.9 * fa;
    ctx.drawImage(FGLOW[f.fac], f.x - 6, f.y - 6, 12, 12);
    ctx.globalAlpha = fa;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(f.x - 1.25, f.y - 1.25, 2.5, 2.5);
  }
}

function draw(tSec) {
  ctx.drawImage(starCnv, 0, 0, W, H);
  var i;

  // far depth layer: distant traffic, slow and low-contrast
  ctx.globalAlpha = 0.3;
  for (i = 0; i < DIST.length; i++) {
    var dz = DIST[i];
    var zx = ((((dz.fx + tSec * dz.dvx) % 1) + 1) % 1) * W;
    ctx.fillStyle = dz.col;
    ctx.fillRect(zx, dz.fy * H, dz.len, 1);
  }
  ctx.globalAlpha = 1;

  // far fleet in the lower-left: dim bars + engine point + rare weapon glints
  for (i = 0; i < FARF.length; i++) {
    var fs = FARF[i];
    var fxp = fs.fx * W + Math.sin(tSec * fs.w + fs.ph) * minDim * 0.012;
    var fyp = fs.fy * H + Math.sin(tSec * fs.w * 0.7 + fs.ph2) * minDim * 0.006;
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = fs.col;
    ctx.fillRect(fxp, fyp, fs.len, 1.2);
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = "#cfdcf0";
    ctx.fillRect(fxp - 1.4, fyp, 1.2, 1.2);          // engine point at the stern
    var gph = (tSec / fs.gper + fs.gph) % 1;
    if (gph < 0.035) {                               // a far-off shot flickers
      ctx.globalAlpha = 0.5 * (1 - gph / 0.035);
      ctx.drawImage(GLOW.red, fxp + fs.len + 2 - 3, fyp - 2.4, 6, 6);
    }
  }
  ctx.globalAlpha = 1;

  // debris: slow specks, position is periodic in time
  ctx.fillStyle = "#434b59";
  ctx.globalAlpha = 0.3;
  for (i = 0; i < DEB.length; i++) {
    var dd = DEB[i];
    var dx2 = (((dd.fx + tSec * dd.dvx) % 1) + 1) % 1;
    var dy2 = (((dd.fy + tSec * dd.dvy) % 1) + 1) % 1;
    ctx.fillRect(dx2 * W, dy2 * H, dd.s, dd.s);
  }
  // lower-left debris field: a nearer layer, so bigger, brighter, slower sway
  ctx.fillStyle = "#4c5567";
  ctx.globalAlpha = 0.42;
  for (i = 0; i < DEBL.length; i++) {
    var dq = DEBL[i];
    ctx.fillRect(
      dq.fx * W + Math.sin(tSec * dq.w + dq.ph) * minDim * 0.02,
      dq.fy * H + Math.sin(tSec * dq.w2 + dq.ph2) * minDim * 0.012,
      dq.s, dq.s);
  }
  ctx.globalAlpha = 1;

  // fighters passing behind the capital line
  ctx.globalCompositeOperation = "lighter";
  drawFighters(false, tSec);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  // capital ships
  for (i = 0; i < caps.length; i++) {
    var cap = caps[i];
    ctx.save();
    ctx.translate(cap.x, cap.y);
    ctx.rotate(cap.ang);
    ctx.drawImage(cap.sprite, -cap.sw / 2, -cap.sh / 2);
    ctx.globalCompositeOperation = "lighter";
    // engine glow with a plume trailing aft
    var gl = GLOW[cap.fac];
    var ea = (0.16 + 0.4 * cap.act) * ENG_BOOST * (0.85 + 0.15 * Math.sin(tSec * 2.1 + cap.dphA));
    var es = cap.len * 0.055;
    for (var e = 0; e < cap.eng.length; e += 2) {
      var ex2 = cap.eng[e], ey2 = cap.eng[e + 1];
      ctx.globalAlpha = ea;
      ctx.drawImage(gl, ex2 - es, ey2 - es, es * 2, es * 2);
      ctx.globalAlpha = ea * 0.5;
      ctx.drawImage(gl, ex2 - es * 2.1, ey2 - es * 0.85, es * 2.2, es * 1.7);
      ctx.globalAlpha = ea * 0.25;
      ctx.drawImage(gl, ex2 - es * 3.4, ey2 - es * 0.7, es * 2.6, es * 1.4);
    }
    // manoeuvring thrusters puff on the swinging side during the yaw cycle
    var yawV = Math.cos(tSec * cap.wY + cap.dphY);
    if (cap.rcs.length && Math.abs(yawV) > 0.55) {
      var rA = (Math.abs(yawV) - 0.55) * 1.4;
      var sgn = yawV > 0 ? 1 : -1;
      for (var rc2 = 0; rc2 < cap.rcs.length; rc2 += 3) {
        var fore = cap.rcs[rc2] > 0 ? 1 : -1;
        if (cap.rcs[rc2 + 2] * fore !== sgn) continue;
        ctx.globalAlpha = rA * 0.55;
        ctx.drawImage(GLOW.white,
          cap.rcs[rc2] - 3.5, cap.rcs[rc2 + 1] + cap.rcs[rc2 + 2] * 3 - 3.5, 7, 7);
      }
    }
    // blinking running lights
    for (var l = 0; l < cap.lights.length; l++) {
      var lt = cap.lights[l];
      var ph = (tSec / lt.per + lt.ph) % 1;
      if (ph < 0.12) {
        ctx.globalAlpha = 0.9;
        ctx.drawImage(gl, lt.x - 3.5, lt.y - 3.5, 7, 7);
      }
    }
    // damage embers flicker
    if (cap.embers.length) {
      ctx.fillStyle = EMBER_COL;
      for (var m = 0; m < cap.embers.length; m += 3) {
        ctx.globalAlpha = 0.2 + 0.45 * Math.abs(Math.sin(tSec * 3 + cap.embers[m + 2]));
        ctx.fillRect(cap.embers[m], cap.embers[m + 1], 1.5, 1.5);
      }
    }
    ctx.restore();
  }

  ctx.globalCompositeOperation = "lighter";

  // explosions
  for (i = 0; i < BOOMS.length; i++) {
    var bm = BOOMS[i];
    if (!bm.active) continue;
    var p = bm.age / bm.dur;
    var a = (p < 0.2 ? p / 0.2 : 1 - (p - 0.2) / 0.8) * 0.8;
    var rr = bm.r * (0.5 + 0.9 * p);
    ctx.globalAlpha = a;
    ctx.drawImage(GLOW[bm.glow], bm.x - rr, bm.y - rr, rr * 2, rr * 2);
    if (p < 0.3) {
      ctx.globalAlpha = a * 0.9;
      ctx.drawImage(GLOW.white, bm.x - rr * 0.3, bm.y - rr * 0.3, rr * 0.6, rr * 0.6);
    }
  }

  // impact debris sparks: short hot streaks thrown from hits and losses
  ctx.strokeStyle = EMBER_COL;
  ctx.lineWidth = 1.2;
  for (i = 0; i < SPARKS.length; i++) {
    var sk = SPARKS[i];
    if (!sk.active) continue;
    ctx.globalAlpha = (1 - sk.age / sk.ttl) * 0.9;
    ctx.beginPath();
    ctx.moveTo(sk.x - sk.vx * 0.04, sk.y - sk.vy * 0.04);
    ctx.lineTo(sk.x, sk.y);
    ctx.stroke();
  }

  // shield hits: a short arc conforming to the hull near the impact point,
  // bright at the impact, falling off along the silhouette, gone in ~400 ms
  for (i = 0; i < SHIMS.length; i++) {
    var sh = SHIMS[i];
    if (!sh.active) continue;
    var sc = caps[sh.cap], o = sc.outline;
    if (!o) continue;
    var on = o.length >> 1;
    var fade = 1 - sh.age / sh.dur;
    ctx.save();
    ctx.translate(sc.x, sc.y);
    ctx.rotate(sc.ang);
    ctx.strokeStyle = COL[sc.fac].shimmer;
    ctx.lineWidth = 2;
    for (var sg = -9; sg < 9; sg++) {
      var i0 = ((sh.idx + sg) % on + on) % on;
      var i1 = ((sh.idx + sg + 1) % on + on) % on;
      var fall = 1 - Math.abs(sg + 0.5) / 9;
      ctx.globalAlpha = fade * fall * fall * 0.85;
      ctx.beginPath();
      ctx.moveTo(o[i0 * 2], o[i0 * 2 + 1]);
      ctx.lineTo(o[i1 * 2], o[i1 * 2 + 1]);
      ctx.stroke();
    }
    ctx.globalAlpha = fade * 0.8;
    ctx.drawImage(GLOW[sc.fac], o[sh.idx * 2] - 6, o[sh.idx * 2 + 1] - 6, 12, 12);
    ctx.restore();
  }

  // weapon bolts: heavy capital shells (slow, fat, recoil flare) and light
  // fighter fire — a white-hot core makes a travelling bolt the brightest
  // thing on screen
  for (i = 0; i < BOLTS.length; i++) {
    var b = BOLTS[i];
    if (!b.active || b.delay > 0) continue;
    var bw = b.heavy ? 4.2 : 2.2;
    var tl = b.heavy ? 0.26 : 0.16;
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = BOLT_COL;
    ctx.lineWidth = bw * 1.9;
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx * tl, b.y - b.vy * tl);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = bw * 0.7;
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx * tl * 0.6, b.y - b.vy * tl * 0.6);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    var gs = b.heavy ? 13 : 8;
    ctx.globalAlpha = 0.8;
    ctx.drawImage(GLOW.red, b.x - gs, b.y - gs, gs * 2, gs * 2);
    ctx.globalAlpha = 1;
    ctx.drawImage(GLOW.white, b.x - gs * 0.5, b.y - gs * 0.5, gs, gs);
    if (b.heavy && b.age < 0.3) {   // recoil-style muzzle flare on main guns
      var mf = 1 - b.age / 0.3;
      ctx.globalAlpha = mf * 0.9;
      ctx.drawImage(GLOW.red, b.sx - 24, b.sy - 24, 48, 48);
      ctx.globalAlpha = mf;
      ctx.drawImage(GLOW.white, b.sx - 10, b.sy - 10, 20, 20);
    } else if (!b.heavy && b.age < 0.12) {
      ctx.globalAlpha = (1 - b.age / 0.12) * 0.8;
      ctx.drawImage(GLOW.red, b.sx - 12, b.sy - 12, 24, 24);
    }
  }

  // fighters passing in front of the capital line
  drawFighters(true, tSec);

  // twinkling stars
  for (i = 0; i < TWK.length; i++) {
    var tw = TWK[i];
    ctx.globalAlpha = 0.12 + 0.2 * (0.5 + 0.5 * Math.sin(tSec * tw.w + tw.ph));
    ctx.drawImage(GLOW.white, tw.fx * W - 3, tw.fy * H - 3, 6, 6);
  }

  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
}

/* =====================================================================
   WebGL2 lit layer.
   Every sprite is baked twice: albedo (the existing 2D bake) and a
   tangent-space normal map derived from the generating geometry — never
   from filtering the albedo. For capitals the jittered per-faction
   profile stations (the same sd/sv arrays the silhouette was drawn
   from) drive a rounded-slab cross-section sweep; superstructure tiers
   recorded by tierStack() get flat faces with bevels oriented by which
   side of the hull they grow from; engine bells get concave rings with
   a hot emissive core; the Order hammerhead's flat bow face gets
   forward-facing normals; lit windows recorded during the albedo bake
   become an emissive mask in A. Both bakes go into
   one atlas pair; the whole frame is ONE instanced draw with
   premultiplied blending (alpha-out 0 == additive). Up to 24 point
   lights come from the sim: explosions, bolts in flight (with a
   lingering tail), muzzle flashes, engine plumes. If WebGL2 is
   unavailable or the context is lost, GLR stays null and the untouched
   Canvas 2D path above renders instead.
   ===================================================================== */
var GLR = null;
var MAXI = 2048, MAXL = 24;

/* Shared analytic normal baker. topAt/botAt give the dorsal/ventral
   generating profile's local y at hull-local x in [0, xMax]; geo carries
   tier rects (with side + sloped end), bells, emissive rects, recessed
   bays, raised ribs, and the bow-face width. */
function bakeNormals(w, h, ox, oy, xMax, topAt, botAt, geo) {
  var out = new Uint8ClampedArray(w * h * 4);
  var x, y, i, oo;
  for (i = 0; i < out.length; i += 4) { out[i] = 128; out[i + 1] = 128; out[i + 2] = 255; }
  for (x = 0; x < w; x++) {
    var lx = x - ox + 0.5;
    if (lx < 0 || lx > xMax) continue;
    var T = topAt(lx), B = botAt(lx);
    if (!(B > T)) continue;
    var la = Math.max(0, lx - 2), lb2 = Math.min(xMax, lx + 2);
    var dT = (topAt(lb2) - topAt(la)) / ((lb2 - la) || 1);
    var dB = (botAt(lb2) - botAt(la)) / ((lb2 - la) || 1);
    var y0 = Math.max(0, Math.round(oy + T)), y1 = Math.min(h - 1, Math.round(oy + B));
    for (y = y0; y <= y1; y++) {
      oo = (y * w + x) * 4;
      // rounded-slab sweep: q in [-1,1] across the local cross-section
      var q = clamp(((y - oy - T) / (B - T)) * 2 - 1, -1, 1);
      var ny = (q < 0 ? -1 : 1) * Math.pow(Math.abs(q), 1.35) * 0.9;
      var nx = clamp((q < 0 ? dT : -dB) * (0.35 + 0.65 * Math.abs(q)), -0.85, 0.85);
      if (geo.prow && lx > xMax - geo.prow) { nx = 0.85; ny *= 0.25; }   // flat bow face
      var l2 = nx * nx + ny * ny;
      if (l2 > 0.94) { var sc2 = Math.sqrt(0.94 / l2); nx *= sc2; ny *= sc2; l2 = 0.94; }
      var nz = Math.sqrt(1 - l2);
      out[oo] = nx * 127 + 128; out[oo + 1] = ny * 127 + 128; out[oo + 2] = nz * 127 + 128; out[oo + 3] = 0;
    }
  }
  for (i = 0; i < geo.tiers.length; i++) {           // tier faces: slope + bevels
    var tr = geo.tiers[i];
    var rx0 = Math.max(0, Math.round(ox + tr.x)), ry0 = Math.max(0, Math.round(oy + tr.y));
    var rx1 = Math.min(w, Math.round(ox + tr.x + tr.w)), ry1 = Math.min(h, Math.round(oy + tr.y + tr.h));
    var tw3 = (rx1 - rx0) || 1;
    for (y = ry0; y < ry1; y++) {
      for (x = rx0; x < rx1; x++) {
        oo = (y * w + x) * 4;
        var fx = 0, fy = 0, fz = 1;
        // one end of the tier ramps into a sloped face (tr.sl picks which)
        var ue = tr.sl > 0 ? (x - rx0) / tw3 : 1 - (x - rx0) / tw3;
        if (ue > 0.7) {
          var sq = (ue - 0.7) / 0.3;
          fx = tr.sl * 0.65 * sq; fz = 1 - 0.45 * sq;
        }
        // the outer face is the top edge for dorsal tiers, bottom for ventral
        if (tr.side < 0) { if (y - ry0 < 2) { fy = -0.8; fz = 0.6; } }
        else             { if (ry1 - 1 - y < 2) { fy = 0.8; fz = 0.6; } }
        if (x - rx0 < 2) { fx = -0.8; fz = 0.6; }
        else if (rx1 - 1 - x < 2) { fx = 0.8; fz = 0.6; }
        var fin = 1 / Math.sqrt(fx * fx + fy * fy + fz * fz);
        out[oo] = fx * fin * 127 + 128; out[oo + 1] = fy * fin * 127 + 128; out[oo + 2] = fz * fin * 127 + 128;
      }
    }
  }
  var bays = geo.bays || [], ribs = geo.ribs || [];
  for (i = 0; i < bays.length; i++) {                // recessed bays: inner walls
    var ba = bays[i];                                // face INTO the cavity, so a
    var qx0 = Math.max(0, Math.round(ox + ba.x));    // raking light lights one wall
    var qy0 = Math.max(0, Math.round(oy + ba.y));    // and shadows the other
    var qx1 = Math.min(w, qx0 + Math.max(2, Math.round(ba.w)));
    var qy1 = Math.min(h, qy0 + Math.max(2, Math.round(ba.h)));
    for (y = qy0; y < qy1; y++) {
      for (x = qx0; x < qx1; x++) {
        oo = (y * w + x) * 4;
        var gx = 0, gy = 0;
        if (x === qx0) gx = 0.7; else if (x === qx1 - 1) gx = -0.7;
        if (y === qy0) gy = 0.7; else if (y === qy1 - 1) gy = -0.7;
        var gz = (gx || gy) ? 0.55 : 1;
        var giv = 1 / Math.sqrt(gx * gx + gy * gy + gz * gz);
        out[oo] = gx * giv * 127 + 128; out[oo + 1] = gy * giv * 127 + 128; out[oo + 2] = gz * giv * 127 + 128;
      }
    }
  }
  for (i = 0; i < ribs.length; i++) {                // raised ribs tilt outward
    var rbb = ribs[i];
    var ux0 = Math.max(0, Math.round(ox + rbb.x)), uy0 = Math.max(0, Math.round(oy + rbb.y));
    var ux1 = Math.min(w, ux0 + Math.max(1, Math.round(rbb.w)));
    var uy1 = Math.min(h, uy0 + Math.max(1, Math.round(rbb.h)));
    var ry2 = (rbb.side < 0 ? -0.75 : 0.75) * 127 + 128;   // (0, ±0.75, 0.66) ~ unit
    for (y = uy0; y < uy1; y++) {
      for (x = ux0; x < ux1; x++) {
        oo = (y * w + x) * 4;
        out[oo] = 128; out[oo + 1] = ry2; out[oo + 2] = 0.66 * 127 + 128;
      }
    }
  }
  for (i = 0; i < geo.bells.length; i++) {           // concave bells, hot core
    var bl = geo.bells[i];
    var bcx = ox + bl.x, bcy = oy + bl.y;
    var bx0 = Math.max(0, Math.floor(bcx - bl.r)), bx1 = Math.min(w - 1, Math.ceil(bcx + bl.r));
    var by0 = Math.max(0, Math.floor(bcy - bl.r)), by1 = Math.min(h - 1, Math.ceil(bcy + bl.r));
    for (y = by0; y <= by1; y++) {
      for (x = bx0; x <= bx1; x++) {
        var ddx = bcx - x, ddy = bcy - y;
        var dr = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dr > bl.r) continue;
        oo = (y * w + x) * 4;
        var cnx = (ddx / bl.r) * 0.8, cny = (ddy / bl.r) * 0.8, cnz = 0.5;
        var civ = 1 / Math.sqrt(cnx * cnx + cny * cny + cnz * cnz);
        out[oo] = cnx * civ * 127 + 128; out[oo + 1] = cny * civ * 127 + 128; out[oo + 2] = cnz * civ * 127 + 128;
        var em = (1 - dr / (bl.r * 0.8)) * 220;
        if (em > out[oo + 3]) out[oo + 3] = em;
      }
    }
  }
  for (i = 0; i < geo.ems.length; i++) {             // emissive windows/portholes
    var es2 = geo.ems[i];
    var ex0 = Math.max(0, Math.round(ox + es2.x)), ey0 = Math.max(0, Math.round(oy + es2.y));
    var ex1 = Math.min(w, ex0 + Math.max(1, Math.round(es2.w))), ey1 = Math.min(h, ey0 + Math.max(1, Math.round(es2.h)));
    var ev = es2.e * 255;
    for (y = ey0; y < ey1; y++) {
      for (x = ex0; x < ex1; x++) {
        oo = (y * w + x) * 4 + 3;
        if (ev > out[oo]) out[oo] = ev;
      }
    }
  }
  return out;
}

/* small static sprites for the GL path */
var STREAK = (function () {
  var c = document.createElement("canvas");
  c.width = 128; c.height = 16;
  var g = c.getContext("2d");
  var grd = g.createLinearGradient(0, 0, 128, 0);
  grd.addColorStop(0, "rgba(255,255,255,0)");
  grd.addColorStop(0.7, "rgba(255,255,255,0.75)");
  grd.addColorStop(1, "rgba(255,255,255,1)");
  g.fillStyle = grd;
  g.globalAlpha = 0.22; g.fillRect(0, 0, 128, 16);
  g.globalAlpha = 0.5;  g.fillRect(0, 3, 128, 10);
  g.globalAlpha = 1;    g.fillRect(0, 6, 128, 4);
  return c;
})();
var WHITE = (function () {
  var c = document.createElement("canvas");
  c.width = 8; c.height = 8;
  var g = c.getContext("2d");
  g.fillStyle = "#ffffff";
  g.fillRect(0, 0, 8, 8);
  return c;
})();

var GL_VS = [
  "#version 300 es",
  "layout(location=0) in vec2 aC;",
  "layout(location=1) in vec4 aPS;",    // center.xy, size.wh (w<0 == mirrored)
  "layout(location=2) in vec4 aUV;",
  "layout(location=3) in vec4 aTint;",
  "layout(location=4) in vec4 aMisc;",  // rot, mode, ambient, spare
  "uniform vec2 uRes;",
  "out vec2 vUV; out vec4 vTint; out vec4 vMisc; out vec2 vPx; out vec2 vRot; out float vFlip;",
  "void main(){",
  "  float flip = aPS.z < 0.0 ? -1.0 : 1.0;",
  "  vec2 sz = vec2(abs(aPS.z), aPS.w);",
  "  vec2 c = (aC - 0.5) * sz;",
  "  float cs = cos(aMisc.x);",
  "  float sn = sin(aMisc.x);",
  "  vec2 wp = aPS.xy + vec2(c.x*cs - c.y*sn, c.x*sn + c.y*cs);",
  "  vPx = wp;",
  "  float ux = flip < 0.0 ? 1.0 - aC.x : aC.x;",
  "  vUV = mix(aUV.xy, aUV.zw, vec2(ux, aC.y));",
  "  vTint = aTint; vMisc = aMisc; vRot = vec2(cs, sn); vFlip = flip;",
  "  vec2 cl = wp / uRes * 2.0 - 1.0;",
  "  gl_Position = vec4(cl.x, -cl.y, 0.0, 1.0);",
  "}"
].join("\n");

var GL_FS = [
  "#version 300 es",
  "precision highp float;",
  "uniform sampler2D uAlb; uniform sampler2D uNrm; uniform sampler2D uBack;",
  "uniform int uNL; uniform vec4 uLP[24]; uniform vec3 uLC[24];",
  "uniform float uLZ; uniform vec3 uKey;",
  "in vec2 vUV; in vec4 vTint; in vec4 vMisc; in vec2 vPx; in vec2 vRot; in float vFlip;",
  "out vec4 o;",
  "void main(){",
  "  float mode = vMisc.y;",
  "  if (mode > 2.5) { o = vec4(texture(uBack, vUV).rgb, 1.0); return; }",   // backdrop
  "  vec4 alb = texture(uAlb, vUV);",
  "  if (mode > 0.5) { o = vec4(alb.rgb * vTint.rgb * vTint.a, 0.0); return; }",  // additive
  "  vec4 nt = texture(uNrm, vUV);",
  "  vec3 N = nt.xyz * 2.0 - 1.0;",
  "  N.x *= vFlip;",
  "  N = normalize(vec3(N.x*vRot.x - N.y*vRot.y, N.x*vRot.y + N.y*vRot.x, N.z));",
  "  float amb = vMisc.z;",
  "  float kd = max(dot(N, uKey), 0.0);",
  "  vec3 acc = alb.rgb * amb * (0.62 + 0.75 * kd);",   // key light sculpts the quiet state
  "  for (int i = 0; i < 24; i++) {",
  "    if (i >= uNL) break;",
  "    vec3 Ld = vec3(uLP[i].xy - vPx, uLZ);",
  "    float d2 = dot(Ld, Ld);",
  "    vec3 L = Ld * inversesqrt(d2);",
  "    float r2 = uLP[i].z * uLP[i].z;",
  "    float at = uLP[i].w * r2 / (r2 + 5.0 * d2);",     // inverse-square-ish
  "    float df = max(dot(N, L), 0.0);",
  "    vec3 Hv = normalize(L + vec3(0.0, 0.0, 1.0));",
  "    float sp = pow(max(dot(N, Hv), 0.0), 36.0) * 0.6 * alb.a;",
  "    acc += (alb.rgb * df + vec3(sp)) * uLC[i] * at;",
  "  }",
  "  acc += alb.rgb * nt.a * 1.4;",                      // emissive, unlit
  "  o = vec4(acc * vTint.rgb * vTint.a, alb.a * vTint.a);",
  "}"
].join("\n");

function glCompile(gl, type, srcTxt) {
  var s = gl.createShader(type);
  gl.shaderSource(s, srcTxt);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function initGL() {
  if (!window.WebGL2RenderingContext) return null;
  var gc = document.createElement("canvas");
  gc.style.cssText = "position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;";
  var gl = gc.getContext("webgl2", { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: true });
  if (!gl) return null;
  var prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, glCompile(gl, gl.VERTEX_SHADER, GL_VS));
    gl.attachShader(prog, glCompile(gl, gl.FRAGMENT_SHADER, GL_FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (err) { return null; }
  document.body.appendChild(gc);
  gc.addEventListener("webglcontextlost", function (ev) {
    ev.preventDefault();
    GLR = null;                 // the Canvas 2D path takes over next frame
    if (gc.parentNode) gc.parentNode.removeChild(gc);
    resize();
  });
  var vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  var qb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  var ib = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ib);
  gl.bufferData(gl.ARRAY_BUFFER, MAXI * 64, gl.DYNAMIC_DRAW);
  for (var a = 0; a < 4; a++) {
    gl.enableVertexAttribArray(1 + a);
    gl.vertexAttribPointer(1 + a, 4, gl.FLOAT, false, 64, a * 16);
    gl.vertexAttribDivisor(1 + a, 1);
  }
  function mkTex() {
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  gl.useProgram(prog);
  var loc = {
    res: gl.getUniformLocation(prog, "uRes"),
    nl: gl.getUniformLocation(prog, "uNL"),
    lp: gl.getUniformLocation(prog, "uLP[0]"),
    lc: gl.getUniformLocation(prog, "uLC[0]"),
    lz: gl.getUniformLocation(prog, "uLZ"),
    key: gl.getUniformLocation(prog, "uKey"),
    alb: gl.getUniformLocation(prog, "uAlb"),
    nrm: gl.getUniformLocation(prog, "uNrm"),
    back: gl.getUniformLocation(prog, "uBack")
  };
  gl.uniform1i(loc.alb, 0);
  gl.uniform1i(loc.nrm, 1);
  gl.uniform1i(loc.back, 2);
  gl.uniform3f(loc.key, 0, -0.6, 0.8);   // key light from screen-top
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.DEPTH_TEST);
  return {
    gl: gl, gc: gc, prog: prog, vao: vao, ib: ib,
    texAlb: mkTex(), texNrm: mkTex(), texBack: mkTex(), loc: loc,
    inst: new Float32Array(MAXI * 16), count: 0,
    lp: new Float32Array(MAXL * 4), lc: new Float32Array(MAXL * 3), nl: 0,
    atlas: null
  };
}

function packAtlas(items) {
  items.sort(function (a, b) { return b.h - a.h; });
  var aw = 1024, i;
  for (i = 0; i < items.length; i++) aw = Math.max(aw, items[i].w + 2);
  var x = 1, y = 1, rowH = 0;
  for (i = 0; i < items.length; i++) {
    var it = items[i];
    if (x + it.w + 1 > aw) { x = 1; y += rowH + 1; rowH = 0; }
    it.x = x; it.y = y;
    x += it.w + 1;
    if (it.h > rowH) rowH = it.h;
  }
  return { w: aw, h: y + rowH + 1 };
}

function blitN(dst, dw, sx0, sy0, srcArr, sw2, sh2) {
  for (var yy = 0; yy < sh2; yy++) {
    dst.set(srcArr.subarray(yy * sw2 * 4, (yy + 1) * sw2 * 4), ((sy0 + yy) * dw + sx0) * 4);
  }
}

function glBuildAtlas() {
  var R = GLR, gl = R.gl, items = [], i;
  for (i = 0; i < caps.length; i++) items.push({ key: "cap" + i, cnv: caps[i].sprite, nrm: caps[i].nrm, w: caps[i].sw, h: caps[i].sh });
  var gk = ["order", "entropy", "white", "warm", "red"];
  for (i = 0; i < gk.length; i++) items.push({ key: "g_" + gk[i], cnv: GLOW[gk[i]], nrm: null, w: 64, h: 64 });
  items.push({ key: "streak", cnv: STREAK, nrm: null, w: 128, h: 16 });
  items.push({ key: "white", cnv: WHITE, nrm: null, w: 8, h: 8 });
  var dim = packAtlas(items);
  var ac = document.createElement("canvas");
  ac.width = dim.w; ac.height = dim.h;
  var ag = ac.getContext("2d");
  var nb = new Uint8Array(dim.w * dim.h * 4);
  for (i = 0; i < nb.length; i += 4) { nb[i] = 128; nb[i + 1] = 128; nb[i + 2] = 255; }
  R.atlas = {};
  for (i = 0; i < items.length; i++) {
    var it = items[i];
    ag.drawImage(it.cnv, it.x, it.y);
    if (it.nrm) blitN(nb, dim.w, it.x, it.y, it.nrm, it.w, it.h);
    R.atlas[it.key] = [it.x / dim.w, it.y / dim.h, (it.x + it.w) / dim.w, (it.y + it.h) / dim.h];
  }
  R.atlas.back = [0, 0, 1, 1];
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.bindTexture(gl.TEXTURE_2D, R.texAlb);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ac);
  // normal data must NOT be premultiplied (A is an emissive mask, RGB a normal)
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.bindTexture(gl.TEXTURE_2D, R.texNrm);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, dim.w, dim.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, nb);
}

function glResize() {
  var R = GLR, gl = R.gl;
  R.gc.width = Math.ceil(W * dpr);
  R.gc.height = Math.ceil(H * dpr);
  gl.viewport(0, 0, R.gc.width, R.gc.height);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.bindTexture(gl.TEXTURE_2D, R.texBack);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, starCnv);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  glBuildAtlas();
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.texAlb);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, R.texNrm);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, R.texBack);
  gl.activeTexture(gl.TEXTURE0);
}

/* instance layout: [x,y,w,h, u0,v0,u1,v1, r,g,b,a, rot,mode,amb,0] */
function pushI(x, y, w2, h2, rot, uv, r, g2, b, a, mode, amb) {
  var R = GLR;
  if (R.count >= MAXI) return;
  var o = R.count * 16;
  R.count++;
  var A2 = R.inst;
  A2[o] = x; A2[o + 1] = y; A2[o + 2] = w2; A2[o + 3] = h2;
  A2[o + 4] = uv[0]; A2[o + 5] = uv[1]; A2[o + 6] = uv[2]; A2[o + 7] = uv[3];
  A2[o + 8] = r; A2[o + 9] = g2; A2[o + 10] = b; A2[o + 11] = a;
  A2[o + 12] = rot; A2[o + 13] = mode; A2[o + 14] = amb; A2[o + 15] = 0;
}

function addLight(x, y, rad, inten, c) {
  var R = GLR;
  if (R.nl >= MAXL) return;
  var o = R.nl * 4, o3 = R.nl * 3;
  R.lp[o] = x; R.lp[o + 1] = y; R.lp[o + 2] = rad; R.lp[o + 3] = inten;
  R.lc[o3] = c[0]; R.lc[o3 + 1] = c[1]; R.lc[o3 + 2] = c[2];
  R.nl++;
}

function pushFightersGL(front, tSec) {
  var A = GLR.atlas;
  for (var i = 0; i < ftrs.length; i++) {
    var f = ftrs[i];
    if (f.front !== front) continue;
    var fa = Math.min(1, f.fadeIn) * Math.min(1, f.timer * 0.5);
    if (fa <= 0.02) continue;
    // near-white glow with a faint faction tint (white glow sprite × tint)
    var frgb = FTR_RGB[f.fac];
    var idx = f.ti;
    for (var k = 0; k < 6; k++) {       // tapered trail as soft additive dots
      var tt = (k + 1) / 6;
      pushI(f.trail[idx * 2], f.trail[idx * 2 + 1], 2 + 6 * tt, 2 + 6 * tt, 0, A.g_white,
        frgb[0], frgb[1], frgb[2], 0.38 * fa * tt * tt, 1, 0);
      idx = (idx + 4) % TRAIL;
    }
    var back = 4 / (f.spd || 1);
    pushI(f.x - f.vx * back, f.y - f.vy * back, 7, 7, 0, A.g_white, frgb[0], frgb[1], frgb[2], 0.55 * fa, 1, 0);
    pushI(f.x, f.y, 12, 12, 0, A.g_white, frgb[0], frgb[1], frgb[2], 0.9 * fa, 1, 0);
    pushI(f.x, f.y, 2.5, 2.5, 0, A.white, 1, 1, 1, fa, 1, 0);
  }
}

function drawGL(tSec) {
  var R = GLR, gl = R.gl, A = R.atlas, i;
  R.count = 0; R.nl = 0;

  /* ---- dynamic lights from the sim: explosions > bolts/muzzles > engines ---- */
  // explosions are the hero moment: fast attack, then a slow fall back to
  // darkness over the boom's multi-second life, hot enough to flood a hull
  for (i = 0; i < BOOMS.length; i++) {
    var lb = BOOMS[i];
    if (!lb.active) continue;
    var lpz = lb.age / lb.dur;
    var env = lpz < 0.12 ? lpz / 0.12 : Math.pow(1 - (lpz - 0.12) / 0.88, 1.5);
    addLight(lb.x, lb.y, Math.max(lb.r * 6, minDim * 0.12),
      env * 2.2 * clamp(lb.r / (minDim * 0.02), 0.6, 5), GLOW_RGB[lb.glow]);
  }
  // bolts carry their own light; heavy shells add TWO trailing lobes so the
  // highlight lingers and visibly rakes along a hull as the shell passes
  for (i = 0; i < BOLTS.length; i++) {
    var lbt = BOLTS[i];
    if (!lbt.active || lbt.delay > 0) continue;
    var bint = lbt.heavy ? 3.4 : 1.9;
    addLight(lbt.x, lbt.y, minDim * (lbt.heavy ? 0.145 : 0.09), bint, BOLT_LIGHT_RGB);
    if (lbt.heavy) {
      addLight(lbt.x - lbt.vx * 0.30, lbt.y - lbt.vy * 0.30, minDim * 0.115, bint * 0.55, BOLT_LIGHT_RGB);
      addLight(lbt.x - lbt.vx * 0.62, lbt.y - lbt.vy * 0.62, minDim * 0.095, bint * 0.28, BOLT_LIGHT_RGB);
      if (lbt.age < 0.3) addLight(lbt.sx, lbt.sy, minDim * 0.13, (1 - lbt.age / 0.3) * 2.8, BOLT_LIGHT_RGB);
    } else if (lbt.age < 0.12) {
      addLight(lbt.sx, lbt.sy, minDim * 0.09, (1 - lbt.age / 0.12) * 1.6, BOLT_LIGHT_RGB);
    }
  }
  for (i = 0; i < caps.length; i++) {
    var lcp = caps[i];
    var lca = Math.cos(lcp.ang), lsa = Math.sin(lcp.ang);
    var lea = (0.16 + 0.4 * lcp.act) * ENG_BOOST;
    addLight(lcp.x - lca * lcp.len * 0.6, lcp.y - lsa * lcp.len * 0.6,
      lcp.len * 0.5, lea * 0.9, FRGB[lcp.fac]);
  }

  /* ---- instances, back to front (one draw preserves this order) ---- */
  pushI(W / 2, H / 2, W, H, 0, A.back, 1, 1, 1, 1, 3, 0);

  for (i = 0; i < DIST.length; i++) {
    var dz = DIST[i];
    var zx = ((((dz.fx + tSec * dz.dvx) % 1) + 1) % 1) * W;
    pushI(zx + dz.len / 2, dz.fy * H + 0.5, dz.len, 1, 0, A.white, dz.rgb[0], dz.rgb[1], dz.rgb[2], 0.3, 1, 0);
  }
  // far fleet in the lower-left: dim bars + engine point + rare weapon glints
  for (i = 0; i < FARF.length; i++) {
    var fs = FARF[i];
    var fxp = fs.fx * W + Math.sin(tSec * fs.w + fs.ph) * minDim * 0.012;
    var fyp = fs.fy * H + Math.sin(tSec * fs.w * 0.7 + fs.ph2) * minDim * 0.006;
    pushI(fxp + fs.len / 2, fyp + 0.6, fs.len, 1.2, 0, A.white, fs.rgb[0], fs.rgb[1], fs.rgb[2], 0.42, 1, 0);
    pushI(fxp - 0.8, fyp + 0.6, 1.2, 1.2, 0, A.white, 0.81, 0.86, 0.94, 0.55, 1, 0);
    var gph = (tSec / fs.gper + fs.gph) % 1;
    if (gph < 0.035) {
      pushI(fxp + fs.len + 2, fyp + 0.6, 6, 6, 0, A.g_red, 1, 1, 1, 0.5 * (1 - gph / 0.035), 1, 0);
    }
  }
  for (i = 0; i < DEB.length; i++) {
    var dd = DEB[i];
    var dx2 = (((dd.fx + tSec * dd.dvx) % 1) + 1) % 1;
    var dy2 = (((dd.fy + tSec * dd.dvy) % 1) + 1) % 1;
    pushI(dx2 * W, dy2 * H, dd.s, dd.s, 0, A.white, DEBRIS_RGB[0], DEBRIS_RGB[1], DEBRIS_RGB[2], 0.3, 1, 0);
  }
  // lower-left debris field: a nearer layer, so bigger, brighter, slower sway
  for (i = 0; i < DEBL.length; i++) {
    var dq = DEBL[i];
    pushI(dq.fx * W + Math.sin(tSec * dq.w + dq.ph) * minDim * 0.02,
      dq.fy * H + Math.sin(tSec * dq.w2 + dq.ph2) * minDim * 0.012,
      dq.s, dq.s, 0, A.white, 0.30, 0.33, 0.40, 0.42, 1, 0);
  }

  pushFightersGL(false, tSec);

  for (i = 0; i < caps.length; i++) {
    var cap = caps[i];
    var ca = Math.cos(cap.ang), sa = Math.sin(cap.ang);
    // ambient 0.7: baked shading recedes, dynamic light sculpts the hull
    pushI(cap.x, cap.y, cap.sw, cap.sh, cap.ang, A["cap" + i], 1, 1, 1, 1, 0, 0.7);
    var guv2 = A["g_" + cap.fac];
    var ea = (0.16 + 0.4 * cap.act) * ENG_BOOST * (0.85 + 0.15 * Math.sin(tSec * 2.1 + cap.dphA));
    var es = cap.len * 0.055;
    for (var e = 0; e < cap.eng.length; e += 2) {
      var ex2 = cap.eng[e], ey2 = cap.eng[e + 1];
      pushI(cap.x + ca * ex2 - sa * ey2, cap.y + sa * ex2 + ca * ey2,
        es * 2, es * 2, cap.ang, guv2, 1, 1, 1, ea, 1, 0);
      var lx2 = ex2 - es;
      pushI(cap.x + ca * lx2 - sa * ey2, cap.y + sa * lx2 + ca * ey2,
        es * 2.2, es * 1.7, cap.ang, guv2, 1, 1, 1, ea * 0.5, 1, 0);
      var lx3 = ex2 - es * 2.1;
      pushI(cap.x + ca * lx3 - sa * ey2, cap.y + sa * lx3 + ca * ey2,
        es * 2.6, es * 1.4, cap.ang, guv2, 1, 1, 1, ea * 0.25, 1, 0);
    }
    // manoeuvring thrusters puff on the swinging side during the yaw cycle
    var yawV = Math.cos(tSec * cap.wY + cap.dphY);
    if (cap.rcs.length && Math.abs(yawV) > 0.55) {
      var rA = (Math.abs(yawV) - 0.55) * 1.4;
      var sgn = yawV > 0 ? 1 : -1;
      for (var rc2 = 0; rc2 < cap.rcs.length; rc2 += 3) {
        var fore = cap.rcs[rc2] > 0 ? 1 : -1;
        if (cap.rcs[rc2 + 2] * fore !== sgn) continue;
        var rpx = cap.rcs[rc2], rpy = cap.rcs[rc2 + 1] + cap.rcs[rc2 + 2] * 3;
        pushI(cap.x + ca * rpx - sa * rpy, cap.y + sa * rpx + ca * rpy,
          7, 7, 0, A.g_white, 1, 1, 1, rA * 0.55, 1, 0);
      }
    }
    for (var l = 0; l < cap.lights.length; l++) {
      var lt = cap.lights[l];
      var ph = (tSec / lt.per + lt.ph) % 1;
      if (ph < 0.12) {
        pushI(cap.x + ca * lt.x - sa * lt.y, cap.y + sa * lt.x + ca * lt.y, 7, 7, 0, guv2, 1, 1, 1, 0.9, 1, 0);
      }
    }
    for (var m = 0; m < cap.embers.length; m += 3) {
      var ema = 0.2 + 0.45 * Math.abs(Math.sin(tSec * 3 + cap.embers[m + 2]));
      pushI(cap.x + ca * cap.embers[m] - sa * cap.embers[m + 1],
        cap.y + sa * cap.embers[m] + ca * cap.embers[m + 1],
        1.6, 1.6, 0, A.white, EMBER_RGB[0], EMBER_RGB[1], EMBER_RGB[2], ema, 1, 0);
    }
  }

  for (i = 0; i < BOOMS.length; i++) {
    var bm = BOOMS[i];
    if (!bm.active) continue;
    var p = bm.age / bm.dur;
    var a = (p < 0.2 ? p / 0.2 : 1 - (p - 0.2) / 0.8) * 0.8;
    var rr = bm.r * (0.5 + 0.9 * p);
    pushI(bm.x, bm.y, rr * 2, rr * 2, 0, A["g_" + bm.glow], 1, 1, 1, a, 1, 0);
    if (p < 0.3) pushI(bm.x, bm.y, rr * 0.6, rr * 0.6, 0, A.g_white, 1, 1, 1, a * 0.9, 1, 0);
  }

  // impact debris sparks: short hot streaks thrown from hits and losses
  for (i = 0; i < SPARKS.length; i++) {
    var sk = SPARKS[i];
    if (!sk.active) continue;
    var sl = Math.max(2, Math.sqrt(sk.vx * sk.vx + sk.vy * sk.vy) * 0.04);
    pushI(sk.x - sk.vx * 0.02, sk.y - sk.vy * 0.02, sl, 1.4, Math.atan2(sk.vy, sk.vx), A.streak,
      EMBER_RGB[0], EMBER_RGB[1], EMBER_RGB[2], (1 - sk.age / sk.ttl) * 0.9, 1, 0);
  }

  for (i = 0; i < SHIMS.length; i++) {
    var sh = SHIMS[i];
    if (!sh.active) continue;
    var sc = caps[sh.cap], o = sc.outline;
    if (!o) continue;
    var on = o.length >> 1;
    var fade = 1 - sh.age / sh.dur;
    var sca = Math.cos(sc.ang), ssa = Math.sin(sc.ang);
    var srgb = SHIM_RGB[sc.fac];
    for (var sg = -9; sg < 9; sg += 2) {
      var i0 = ((sh.idx + sg) % on + on) % on;
      var fall = 1 - Math.abs(sg + 0.5) / 9;
      var oxp = o[i0 * 2], oyp = o[i0 * 2 + 1];
      pushI(sc.x + sca * oxp - ssa * oyp, sc.y + ssa * oxp + sca * oyp,
        6, 6, 0, A.g_white, srgb[0], srgb[1], srgb[2], fade * fall * fall * 0.85, 1, 0);
    }
    var ix = o[sh.idx * 2], iy = o[sh.idx * 2 + 1];
    pushI(sc.x + sca * ix - ssa * iy, sc.y + ssa * ix + sca * iy,
      12, 12, 0, A["g_" + sc.fac], 1, 1, 1, fade * 0.8, 1, 0);
  }

  // weapon bolts: heavy capital shells (slow, fat, recoil flare) and light
  // fighter fire — streak sprite oriented along the velocity
  for (i = 0; i < BOLTS.length; i++) {
    var b = BOLTS[i];
    if (!b.active || b.delay > 0) continue;
    var tl = b.heavy ? 0.26 : 0.16;
    var blen = Math.sqrt(b.vx * b.vx + b.vy * b.vy) * tl;
    var rot = Math.atan2(b.vy, b.vx);
    var bh = b.heavy ? 8 : 4.2;
    pushI(b.x - b.vx * tl * 0.5, b.y - b.vy * tl * 0.5, blen, bh, rot, A.streak, BOLT_RGB[0], BOLT_RGB[1], BOLT_RGB[2], 0.9, 1, 0);
    pushI(b.x - b.vx * tl * 0.3, b.y - b.vy * tl * 0.3, blen * 0.55, bh * 0.36, rot, A.streak, 1, 1, 1, 0.95, 1, 0);
    var gs = b.heavy ? 13 : 8;
    pushI(b.x, b.y, gs * 2, gs * 2, 0, A.g_red, 1, 1, 1, 0.8, 1, 0);
    pushI(b.x, b.y, gs, gs, 0, A.g_white, 1, 1, 1, 1, 1, 0);
    if (b.heavy && b.age < 0.3) {   // recoil-style muzzle flare on main guns
      var mf = 1 - b.age / 0.3;
      pushI(b.sx, b.sy, 48, 48, 0, A.g_red, 1, 1, 1, mf * 0.9, 1, 0);
      pushI(b.sx, b.sy, 20, 20, 0, A.g_white, 1, 1, 1, mf, 1, 0);
    } else if (!b.heavy && b.age < 0.12) {
      pushI(b.sx, b.sy, 24, 24, 0, A.g_red, 1, 1, 1, (1 - b.age / 0.12) * 0.8, 1, 0);
    }
  }

  pushFightersGL(true, tSec);

  for (i = 0; i < TWK.length; i++) {
    var tw = TWK[i];
    pushI(tw.fx * W, tw.fy * H, 6, 6, 0, A.g_white, 1, 1, 1,
      0.12 + 0.2 * (0.5 + 0.5 * Math.sin(tSec * tw.w + tw.ph)), 1, 0);
  }

  /* ---- one instanced draw ---- */
  gl.useProgram(R.prog);
  gl.bindVertexArray(R.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, R.ib);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, R.inst.subarray(0, R.count * 16));
  gl.uniform2f(R.loc.res, W, H);
  gl.uniform1i(R.loc.nl, R.nl);
  gl.uniform4fv(R.loc.lp, R.lp);
  gl.uniform3fv(R.loc.lc, R.lc);
  gl.uniform1f(R.loc.lz, minDim * 0.05);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, R.count);
}

/* ---------------- main loop (fps-gated) ---------------- */
var FPS = 20, T0 = 0;
try {
  var qs = new URLSearchParams(window.location.search);
  var qf = parseFloat(qs.get("fps"));
  if (isFinite(qf)) FPS = clamp(qf, 1, 60);
  var qt = parseFloat(qs.get("t"));         // debug: start the clock at t seconds
  if (isFinite(qt)) T0 = clamp(qt, 0, 1e6);
} catch (err) { /* ignore */ }
var FRAME_MS = 1000 / FPS;
var last = 0, started = 0;

function tick(now) {
  window.requestAnimationFrame(tick);
  if (!started) { started = now; last = now; return; }
  var elapsed = now - last;
  if (elapsed < FRAME_MS - 1) return;
  last = now - (elapsed % FRAME_MS);
  var dt = Math.min(elapsed / 1000, 0.1);
  var tSec = (now - started) / 1000 + T0;
  update(dt, tSec);
  if (GLR) drawGL(tSec);
  else draw(tSec);
}

var resizeTimer = 0;
window.addEventListener("resize", function () {
  window.clearTimeout(resizeTimer);
  resizeTimer = window.setTimeout(resize, 150);
});

try { GLR = initGL(); } catch (eGL) { GLR = null; }
resize();
window.requestAnimationFrame(tick);

})();
</script>
</body>
</html>
